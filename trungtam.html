<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thông báo</title>
<style>
:root{--nen:#f4f6f9;--the:#fff;--chu:#1b2430;--phu:#5a6675;--vien:#d5dbe3;--chinh:#1f5fbf;--chinh-dam:#174a96;
  --do:#b42318;--do-nen:#fde8e6;--cam:#b54708;--cam-nen:#fff1e0;--xanh:#127a3c;--xanh-nen:#e3f5ea;--vang-nen:#fff8db}
*{box-sizing:border-box}
body{margin:0;background:var(--nen);color:var(--chu);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.khung{max-width:680px;margin:0 auto;padding:12px 16px 80px}
h1{font-size:21px;margin:4px 0 2px}
h2{font-size:18px;margin:20px 0 6px}
.phu{color:var(--phu);font-size:15px}
a{color:var(--chinh)}
.dau{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.chi{background:var(--vang-nen);border-left:4px solid #e0b100;padding:8px 12px;border-radius:8px;margin:10px 0;font-size:16px}
.capnhat{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--phu);font-size:15px;margin-top:8px}
.ba-so{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.o-so{background:var(--the);border:1px solid var(--vien);border-radius:12px;padding:8px 4px;text-align:center;font-size:15px}
.o-so b{display:block;font-size:26px;line-height:1.2}
.o-so.do b{color:var(--do)} .o-so.cam b{color:var(--cam)} .o-so.lam b{color:var(--chinh-dam)}
.nhom-chu{font-weight:700;margin:16px 0 6px}
.the{background:var(--the);border:1px solid var(--vien);border-radius:12px;padding:12px;margin:10px 0}
.the.qua{border-left:5px solid var(--do)}
.nhan{display:inline-block;font-size:15px;font-weight:700;padding:1px 8px;border-radius:6px;margin:0 6px 4px 0;background:#eef1f5;color:var(--phu)}
.nhan.do{background:var(--do-nen);color:var(--do)} .nhan.cam{background:var(--cam-nen);color:var(--cam)}
.nhan.xanh{background:var(--xanh-nen);color:var(--xanh)} .nhan.lam{background:#e8f0fc;color:var(--chinh-dam)}
.tieu{font-size:17px;font-weight:700;margin:2px 0 4px;word-break:break-word}
.dong{margin:2px 0;word-break:break-word}
.dong b{color:var(--phu);font-weight:600}
.noi{border-top:1px dashed var(--vien);margin-top:10px;padding-top:8px}
.nut-hang{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.nut,a.nut{min-height:48px;padding:8px 14px;font-size:16px;font-weight:600;border-radius:10px;border:2px solid var(--chinh);
  background:var(--chinh);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.nut.phu2,a.nut.phu2{background:#fff;color:var(--chinh-dam)}
button.nut.nguy{background:#fff;color:var(--do);border-color:var(--do)}
button.nut:disabled{opacity:.5;cursor:not-allowed}
button.nut.nho{min-height:44px;padding:4px 12px;font-size:15px}
.nhom-dau{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:8px 12px;
  border:1px solid var(--vien);border-radius:12px;background:var(--the);font-size:17px;font-weight:700;color:var(--chu);cursor:pointer;text-align:left;margin-top:10px}
.nhom-dau .tt{font-size:15px;font-weight:400;color:var(--phu)}
label.o{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=date],input[type=time],input[type=search],textarea,select{width:100%;font-size:16px;padding:10px;border:1px solid #9aa6b5;border-radius:10px;background:#fff;color:var(--chu);font-family:inherit;min-height:48px}
textarea{min-height:120px;resize:vertical}
.hai{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chon-hang{display:flex;flex-wrap:wrap;gap:8px}
.chon-hang button{min-height:48px;padding:6px 14px;font-size:16px;border:2px solid var(--vien);border-radius:10px;background:#fff;color:var(--chu);cursor:pointer}
.chon-hang button.dang{border-color:var(--chinh);background:#e8f0fc;color:var(--chinh-dam);font-weight:700}
.bao{padding:10px 12px;border-radius:10px;margin:10px 0}
.bao.do{background:var(--do-nen);color:#7a1610} .bao.xanh{background:var(--xanh-nen);color:#0b4f27} .bao.cam{background:var(--cam-nen);color:#7a3306}
details{margin:8px 0} summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--chinh-dam)}
.goc{white-space:pre-wrap;background:#f7f8fa;border:1px dashed var(--vien);border-radius:8px;padding:8px;font-size:15px;max-height:260px;overflow:auto}
.cho{padding:24px 12px;text-align:center;color:var(--phu)}
.lop{position:fixed;inset:0;background:rgba(15,23,35,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.hop{background:#fff;width:100%;max-width:680px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:#1b2430;color:#fff;padding:10px 16px;border-radius:10px;
  z-index:30;max-width:calc(100% - 32px);font-size:15px}
.an{display:none!important}
</style>
</head>
<body>
<div class="khung">
  <div class="dau">
    <div><h1>🔔 Thông báo</h1><div class="phu" id="xinChao">Đang mở…</div></div>
    <a class="nut phu2" href="trangchu.html">🏠 Trang chủ</a>
  </div>
  <div id="manChinh"><div class="cho">⏳ Đang tải… máy chủ có thể mất 5–10 giây, đừng tải lại trang.</div></div>
</div>
<div id="lop"></div>
<div id="toast" class="toast an"></div>
<script src="trungtam-cau-hinh.js"></script>
<script>
/* Trang HỘP THÔNG BÁO (đợt 3, vé 03). Hộp chỉ có thông báo: tin của công ty thì ĐỌC + ✅ Đã hiểu tại chỗ;
 * việc của hệ khác thì bấm "Mở ›" sang trang hệ đó — không nhận việc, trả lời, duyệt ở đây.
 * Mọi luật (ai thấy gì, mức nào, quyền đăng) ở MÁY CHỦ; trang chỉ bày, lọc bằng cờ có sẵn trên từng dòng, và gửi. */
var KHOA_PHIEN = 'phien_ds_v3';          // CHUNG vé đăng nhập với Trang chủ hệ tuyển dụng
var KHOA_NHO = 'tb_hop_v1';              // bản nhớ trong máy: CHỈ đầu mục của chính người đang đăng nhập, không có nội dung tin
var CHI_DOC = ['tb_mo', 'tt_dang_mo', 'tt_theo_doi'];
var LAM_MOI_MS = 5 * 60000;              // quay lại trang sau ≥ 5 phút mới tự hỏi máy chủ; bấm 🔄 thì hỏi ngay
var st = { mo: null, luc: 0, tu_nho: false, dang_tai: null, loi_tai: '', man: 'hop', loc: 'tat_ca', muc: '', tim: '',
           doc: {}, gui: {}, loi_dong: {}, dg: null, dm: null, theo: null, chuaDoc: {}, ban: false };

var $ = function (id) { return document.getElementById(id); };
function e(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function layPhien() { try { return localStorage.getItem(KHOA_PHIEN) || ''; } catch (x) { return ''; } }
function p2(n) { return ('0' + n).slice(-2); }
function ngayMay(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function homNay() { return ngayMay(new Date()); }
function maYc() { return 'yc-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
function baoNhanh(s) { var t = $('toast'); t.textContent = s; t.classList.remove('an'); clearTimeout(baoNhanh.h); baoNhanh.h = setTimeout(function () { t.classList.add('an'); }, 3000); }
/** Mốc ms → '07:10', khác ngày thì '07:10 ngày 09/11'. */
function gioPhut(ms) {
  var d = new Date(ms), g = p2(d.getHours()) + ':' + p2(d.getMinutes());
  return ngayMay(d) === homNay() ? g : g + ' ngày ' + p2(d.getDate()) + '/' + p2(d.getMonth() + 1);
}
/** '2026-11-10 07:10:00' (giờ máy chủ ghi) → '07:10', khác ngày thì '07:10 ngày 09/11'. */
function gioTu(s) {
  s = String(s || '');
  var g = s.slice(11, 16);
  return s.slice(0, 10) === homNay() ? g : g + ' ngày ' + s.slice(8, 10) + '/' + s.slice(5, 7);
}

/* ---------- gọi máy chủ: có hết giờ; chỉ cú CHỈ ĐỌC tự thử lại một lần ---------- */
function goi(hd, them) {
  var body = { hanh_dong: hd, phien: layPhien() };
  for (var k in (them || {})) body[k] = them[k];
  var doc = CHI_DOC.indexOf(hd) >= 0;
  function motLan(han) {
    return new Promise(function (ok) {
      var xong = false, h = setTimeout(function () { xong = true; ok({ ok: false, ma: 'MANG', loi: 'Chờ quá lâu — sóng yếu hoặc máy chủ chậm. Thử lại.' }); }, han);
      fetch(URL_TRUNG_TAM, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
        .then(function (r) { return r.text(); })
        .then(function (t) { if (xong) return; clearTimeout(h); try { ok(JSON.parse(t)); } catch (x) { ok({ ok: false, ma: 'MANG', loi: 'Máy chủ thông báo đang trục trặc. Thử lại sau ít phút.' }); } })
        .catch(function () { if (xong) return; clearTimeout(h); ok({ ok: false, ma: 'MANG', loi: 'Không nối được máy chủ — kiểm sóng điện thoại rồi thử lại.' }); });
    });
  }
  return motLan(doc ? 30000 : 90000).then(function (kq) {
    if (doc && kq.ma === 'MANG') return new Promise(function (ok) { setTimeout(ok, 1500); }).then(function () { return motLan(30000); });
    return kq;
  });
}

/* ---------- bản nhớ trong máy: mở trang là thấy ngay danh sách lần trước, rồi mới cập nhật ---------- */
/** Dấu của vé đang dùng (không đảo ngược ra vé được) — để bản nhớ của người trước không hiện cho người sau. */
function dauVe() { var s = layPhien(), h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36) + '.' + s.length; }
function xoaNho() { try { localStorage.removeItem(KHOA_NHO); } catch (x) {} }
function docNho() {
  try {
    var o = JSON.parse(localStorage.getItem(KHOA_NHO) || 'null');
    if (o && o.chu === dauVe() && o.kq && o.kq.ds && o.kq.tk) return o;
  } catch (x) {}
  xoaNho();
  return null;
}
function catNho() {
  if (!st.mo || st.tu_nho) return;
  try {
    var kq = JSON.parse(JSON.stringify(st.mo));
    kq.ds.forEach(function (x) { delete x.tin; });           // nội dung 4 dòng không nằm lại trong máy
    localStorage.setItem(KHOA_NHO, JSON.stringify({ chu: dauVe(), luc: st.luc, kq: kq }));
  } catch (x) {}
}

/* ---------- mở trang ---------- */
function manLoi(tieu, cau, coLink) {
  $('manChinh').innerHTML = '<div class="the"><div class="tieu">' + e(tieu) + '</div><div class="dong">' + e(cau) + '</div>'
    + (coLink ? '<div class="nut-hang"><a class="nut" href="trangchu.html">🏠 Mở Trang chủ để đăng nhập</a></div>' : '')
    + '<div class="nut-hang"><button class="nut phu2" data-lam="tai_lai">🔄 Thử lại</button></div></div>';
}
function tai() {
  if (!URL_TRUNG_TAM) { manLoi('⚠️ Trang chưa khai địa chỉ máy chủ', 'Quản trị cần dán địa chỉ /exec của máy chủ thông báo vào tệp trungtam-cau-hinh.js.', false); return Promise.resolve(); }
  if (!layPhien()) {
    xoaNho(); st.mo = null;
    $('xinChao').textContent = 'Chưa đăng nhập';
    manLoi('🔐 Bạn chưa đăng nhập', 'Mở Trang chủ, đăng nhập một lần, rồi bấm lại ô Thông báo.', true);
    return Promise.resolve();
  }
  if (st.dang_tai) return st.dang_tai;
  if (!st.mo) { var n = docNho(); if (n) { st.mo = n.kq; st.luc = n.luc; st.tu_nho = true; } }
  st.dang_tai = goi('tb_mo').then(function (kq) {
    st.dang_tai = null;
    if (!kq.ok) {
      if (kq.ma === 'HET_PHIEN') { xoaNho(); st.mo = null; manLoi('🔐 Phiên đăng nhập đã hết', kq.loi, true); return; }
      if (!st.mo) { manLoi('⚠️ Chưa mở được', kq.loi, false); return; }
      st.loi_tai = kq.loi;
      if (st.man === 'hop') ve();
      return;
    }
    st.mo = kq; st.luc = Date.now(); st.tu_nho = false; st.loi_tai = ''; st.loi_dong = {};
    kq.ds.forEach(function (x) { if (st.gui[khoaDong(x)]) danhDauDaHieu(x); });     // cú Đã hiểu còn đang bay: giữ dấu trên màn
    catNho();
    if (!kq.tk.quyen.dang_tin) st.man = 'hop';
    if (st.man === 'hop') ve(); else veDau();                  // đang gõ ở màn Đăng tin thì không vẽ lại, khỏi mất con trỏ
  });
  if (st.mo && st.man === 'hop') ve();
  return st.dang_tai;
}
/** Quay lại trang (đổi tab, bấm lùi từ trang hệ khác): chỉ hỏi máy chủ khi bản đang xem đã cũ hơn 5 phút. */
function quayLai() { if (!document.hidden && st.mo && Date.now() - st.luc >= LAM_MOI_MS) tai(); }
document.addEventListener('visibilitychange', quayLai);
window.addEventListener('pageshow', function (ev) { if (ev.persisted) quayLai(); });

/* ---------- vẽ ---------- */
function veDau() {
  var tk = st.mo.tk;
  $('xinChao').textContent = 'Xin chào ' + tk.ten + ' · ' + tk.chuc_ten.join(', ') + (tk.phong ? ' · phòng ' + tk.phong : '');
}
function ve() {
  veDau();
  $('manChinh').innerHTML = { hop: veHop, dang: veManDang, theo: veManTheo }[st.man]();
}

/* ---------- màn hộp ---------- */
var LOC = [['tat_ca', 'Tất cả'], ['cua_toi', 'Của tôi'], ['phong_toi', 'Phòng tôi'], ['toi_gui', 'Tôi gửi']];
var MUC_CHU = { gap: ['🔴 Gấp', 'do'], can_lam: ['📌 Hôm nay', 'cam'], de_biet: ['⚪ Để biết', ''] };
function khoaDong(x) { return x.nguon + '|' + x.ma; }
function timDong(k) { return st.mo ? st.mo.ds.filter(function (x) { return khoaDong(x) === k; })[0] : null; }
function demDs(ds) {
  var d = { gap: 0, hom_nay: 0, chua_doc: 0 };
  ds.forEach(function (x) { if (x.muc === 'gap') d.gap++; if (x.muc === 'can_lam') d.hom_nay++; if (!x.da_doc) d.chua_doc++; });
  return d;
}
function locDs(ds, loc) { return loc === 'tat_ca' ? ds : ds.filter(function (x) { return x[loc]; }); }
function tenHangMuc(ma) {
  var h = st.mo.hang_muc.filter(function (x) { return x.ma === ma; })[0];
  return h ? (h.bieu_tuong ? h.bieu_tuong + ' ' : '') + h.ten : ma;
}
function danhDauDaHieu(x) { x.da_doc = true; if (x.muc_da_doc) x.muc = x.muc_da_doc; if (x.tin) x.tin.da_hieu = true; }

function veHop() {
  var m = st.mo, tat = m.ds, dem = demDs(tat), n = dem.gap + dem.hom_nay, ds = locDs(tat, st.loc), h = '';
  h += '<div class="capnhat">' + (st.dang_tai
    ? '<span>⏳ Đang cập nhật… máy chủ có thể mất 5–10 giây, đừng tải lại trang.</span>'
    : '<span>' + (st.tu_nho ? 'Bản lưu trong máy lúc ' : 'Cập nhật lúc ') + e(gioPhut(st.luc)) + '</span>'
      + '<button class="nut phu2 nho" data-lam="lam_moi">🔄 Làm mới</button>') + '</div>';
  if (st.loi_tai && !st.dang_tai) {
    h += '<div class="bao cam">⚠️ Chưa cập nhật được: ' + e(st.loi_tai) + ' Bạn đang xem bản lúc ' + e(gioPhut(st.luc))
      + ' — có thể thiếu tin mới. Bấm 🔄 Làm mới để thử lại.</div>';
  }
  h += '<div class="chi">👉 ' + (n ? 'Hôm nay bạn có <b>' + n + ' việc cần làm</b>. Làm từ trên xuống: mục 🔴 trước, mục 📌 sau.'
                                   : 'Hôm nay bạn không có việc nào cần làm. 👍') + '</div>';
  h += '<div class="ba-so"><div class="o-so do"><b>' + dem.gap + '</b>🔴 Gấp</div><div class="o-so cam"><b>' + dem.hom_nay + '</b>📌 Hôm nay</div>'
    + '<div class="o-so lam"><b>' + dem.chua_doc + '</b>📬 Chưa đọc</div></div>';
  if (m.tk.quyen.dang_tin) {
    h += '<div class="nut-hang"><button class="nut phu2" data-lam="man" data-ma="dang">✍️ Đăng tin</button>'
      + '<button class="nut phu2" data-lam="man" data-ma="theo">👀 Theo dõi ai chưa đọc</button></div>';
  }
  h += '<div class="nhom-chu">Xem thông báo của ai?</div><div class="chon-hang">' + LOC.map(function (l) {
    return '<button data-lam="loc" data-ma="' + l[0] + '" class="' + (st.loc === l[0] ? 'dang' : '') + '">' + l[1] + ' (' + locDs(tat, l[0]).length + ')</button>';
  }).join('') + '</div>';

  [['gap', '🔴 Cần làm ngay', 'Không có việc gấp.'], ['can_lam', '📌 Hôm nay', 'Không có việc nào cho hôm nay.']].forEach(function (k) {
    var trong = ds.filter(function (x) { return x.muc === k[0]; });
    h += '<h2>' + k[1] + ' (' + trong.length + ')</h2>' + (trong.length ? trong.map(function (x) { return theDong(x, false); }).join('')
                                                                         : '<div class="phu">' + k[2] + '</div>');
  });

  h += '<h2>📂 Xem theo hạng mục</h2><div class="phu">Mọi thông báo, xếp theo loại. Bấm một mục để mở; mở mục khác thì mục cũ tự đóng.</div>'
    + '<input type="search" id="hmTim" style="margin-top:8px" placeholder="🔎 Tìm theo tiêu đề hoặc người gửi" value="' + e(st.tim) + '" aria-label="Tìm thông báo">'
    + veHangMuc(ds);
  return h;
}

function dongVang(g) {
  return '<div class="bao cam">⚠️ Chưa lấy được việc từ <b>' + e(g.ten) + '</b>' + (g.tu_luc ? ' từ ' + e(gioTu(g.tu_luc)) : '')
    + '. Việc bên dưới có thể đã cũ — mở thẳng trang đó để xem.</div>';
}
function veHangMuc(ds) {
  var m = st.mo, tim = boDauTrang(st.tim), h = '';
  var loc = tim ? ds.filter(function (x) { return boDauTrang(x.tieu_de + ' ' + x.tu).indexOf(tim) >= 0; }) : ds;
  // Nguồn đang hỏng → dòng vàng ở đúng hạng mục đang có việc của nguồn đó; chưa biết hạng mục nào thì báo chung ở đầu.
  var loiMuc = {}, loiChung = [];
  (m.nguon_loi || []).forEach(function (g) {
    var muc = {};
    m.ds.forEach(function (x) { if (x.nguon === g.ten) muc[x.hang_muc] = 1; });
    if (Object.keys(muc).length) Object.keys(muc).forEach(function (ma) { (loiMuc[ma] = loiMuc[ma] || []).push(g); });
    else loiChung.push(g);
  });
  h += loiChung.map(dongVang).join('');
  var co = m.hang_muc.filter(function (hm) {
    return loc.some(function (x) { return x.hang_muc === hm.ma; }) || (!tim && loiMuc[hm.ma]);
  });
  if (!co.length) {
    h += '<div class="the cho">' + (tim ? 'Không thấy thông báo nào có chữ "' + e(st.tim) + '". Thử chữ khác, hoặc xoá ô tìm.'
                                        : st.loc !== 'tat_ca' ? 'Không có thông báo nào ở lựa chọn này. Bấm "Tất cả" để xem hết.'

    if (st.dm.khan) {
      h += '<label class="o">Mức gấp</label><div class="chon-hang"><button data-lam="dg_khan" class="' + (d.khan ? 'dang' : '') + '">' + (d.khan ? '✓ ' : '') + '🔴 Tin Khẩn</button></div>'
        + '<div class="phu">' + (d.khan ? 'Tin sẽ nằm ở mục 🔴 Cần làm ngay của người nhận tới khi họ bấm Đã hiểu. Bấm lần nữa để bỏ.' : 'Chỉ bật khi mọi người phải đọc ngay. Tin thường thì để nguyên.') + '</div>';
    }
    h += '<div class="hai"><div><label class="o" for="dgDuyet">Ai đã duyệt tin này</label><input type="text" id="dgDuyet" value="' + e(d.duyet) + '" placeholder="Vd: Giám đốc"></div>'
      + '<div><label class="o" for="dgNgayDuyet">Ngày duyệt</label><input type="date" id="dgNgayDuyet" value="' + e(d.ngay_duyet) + '"></div></div>';
  } else {
    h += '<label class="o" for="dgLyDo">Lý do đính chính (bắt buộc)</label><input type="text" id="dgLyDo" value="' + e(d.ly_do) + '" placeholder="Vd: Dời giờ họp">';
  }
  if (d.loi) h += hopLoi(d.loi);
  h += '<div class="nut-hang"><button class="nut" data-lam="dg_dang" ' + (!tuViet && d.so_la.length && !q.sua_tin ? 'disabled' : '') + '>✅ Đúng, đăng</button>'
    + (d.ma_luot ? '<button class="nut phu2" data-lam="dg_doc_lai">🔁 Đọc sai, đọc lại</button>' : '')
    + '<button class="nut phu2" data-lam="dg_moi">Thôi</button></div>';
  return h;
}
function veTheoDoi(q) {
  if (!st.theo) return '<div class="phu">Đang tải…</div>';
  if (!st.theo.ok) return '<div class="bao do">⚠️ ' + e(st.theo.loi) + '</div>';
  if (!st.theo.tin.length) return '<div class="phu">Chưa có tin nào ' + (q.sua_tin ? '' : 'của bạn ') + 'đang dùng.</div>';
  return st.theo.tin.map(function (t) {
    var cd = st.chuaDoc[t.ma_tin];
    return '<div class="the">' + nhanTin(t) + '<div class="tieu">' + e(t.tieu_de) + '</div><div class="dong"><b>' + t.so_da_hieu + '/' + t.so_nhan + '</b> người đã hiểu · gửi ' + e(t.nguoi_nhan) + '</div>'
      + (rieng(t) ? '<div class="phu">Tin gửi riêng — không báo vào nhóm Zalo chung.</div>' : t.zalo && t.zalo !== 'da_gui' ? '<div class="bao cam">⚠️ Zalo chưa báo được.</div>' : '')
      + (cd ? (cd.length ? cd.map(function (g) { return '<div class="dong"><b>Nhóm ' + e(g.nhom) + ':</b> ' + e(g.ten.join(', ')) + '</div>'; }).join('') : '<div class="phu">Mọi người đã đọc.</div>') : '')
      + '<div class="nut-hang"><button class="nut phu2" data-lam="ai_chua" data-ma="' + e(t.ma_tin) + '">👀 Ai chưa đọc</button>'
      + (t.so_da_hieu < t.so_nhan && !rieng(t) ? '<button class="nut phu2" data-lam="nhac_tin" data-ma="' + e(t.ma_tin) + '">🔔 Nhắc vào nhóm</button>' : '')
      + (t.zalo && t.zalo !== 'da_gui' && !rieng(t) ? '<button class="nut phu2" data-lam="gui_lai" data-ma="' + e(t.ma_tin) + '">📤 Gửi lại Zalo</button>' : '')
      + (q.sua_tin ? '<button class="nut phu2" data-lam="dinh_chinh" data-ma="' + e(t.ma_tin) + '">✏️ Đính chính</button><button class="nut nguy" data-lam="thu_hoi" data-ma="' + e(t.ma_tin) + '">🗑️ Thu hồi</button>' : '')
      + '</div></div>';
  }).join('');
}
function taiTheoDoi() { goi('tt_theo_doi').then(function (kq) { st.theo = kq; if (st.man === 'theo') ve(); }); }

/** Ô nhập → trạng thái, NGAY lúc gõ. Trang hay vẽ lại (số mới về, tin vừa đăng), giữ chữ ở trạng thái thì vẽ lại không mất chữ đang gõ. */
function dongBo(o) {
  var id = o.id, v = o.value, d = st.dg;
  if (d) {
    if (id === 'dgNguon') d.nguon = v;
    else if (id === 'dgBoSung') d.bo_sung = v;
    else if (id === 'dgDuyet') d.duyet = v;
    else if (id === 'dgNgayDuyet') d.ngay_duyet = v;
    else if (id === 'dgLyDo') d.ly_do = v;
    else if (d.ban && id === 'dgNgayHop') d.ban._ngay = v;
    else if (d.ban && id === 'dgGioHop') d.ban._gio = v;
    else if (d.ban && id === 'dgHan') d.ban.han_can_lam = v;
    else if (d.ban && id.indexOf('dg_') === 0) d.ban[id.slice(3)] = v;
  }
}
/** Bản gửi máy chủ: ghép ngày + giờ họp từ hai ô. */
function banGui(b) {
  var o = {};
  for (var k in b) if (k.charAt(0) !== '_') o[k] = b[k];
  if (b.loai === 'hop') o.ngay_gio_hop = b._ngay && b._gio ? b._ngay + ' ' + b._gio : '';
  return o;
}
function nhanBan(b) { b._ngay = String(b.ngay_gio_hop || '').slice(0, 10); b._gio = String(b.ngay_gio_hop || '').slice(11); return b; }
function banTrong() { return { tieu_de: '', loai: 'thong_bao', viec_gi: '', ai_lien_quan: '', khi_nao: '', can_lam: '', ngay_gio_hop: '', dia_diem: '', han_can_lam: '', tuan: '', _ngay: '', _gio: '' }; }

function boDauTrang(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim(); }

/* ---------- hộp hỏi (lý do, ghi chú, đổi hạn) ---------- */
function hopHoi(o) {
  $('lop').innerHTML = '<div class="lop"><div class="hop"><div class="tieu">' + e(o.tieu) + '</div>' + (o.mo_ta ? '<div class="dong phu">' + e(o.mo_ta) + '</div>' : '')
    + (o.kieu === 'han' ? '<div class="hai" style="margin-top:8px"><input type="date" id="hopNgay"><input type="time" id="hopGio" aria-label="Giờ (không bắt buộc)"></div>'
                        : '<textarea id="hopChu" style="min-height:90px;margin-top:8px" placeholder="' + e(o.goi_y || '') + '"></textarea>')
    + '<div class="bao do an" id="hopLoi"></div><div class="nut-hang"><button class="nut" id="hopOk">' + e(o.nut) + '</button><button class="nut phu2" id="hopThoi">Thôi</button></div></div></div>';
  $('hopThoi').onclick = function () { $('lop').innerHTML = ''; };
  $('hopOk').onclick = function () {
    var v = o.kieu === 'han' ? ($('hopNgay').value ? $('hopNgay').value + ($('hopGio').value ? ' ' + $('hopGio').value : '') : '') : $('hopChu').value.trim();
    if (o.bat_buoc && !v) { $('hopLoi').textContent = o.bat_buoc; $('hopLoi').classList.remove('an'); return; }
    $('hopOk').disabled = true; $('hopOk').textContent = 'Đang gửi…';
    o.xong(v).then(function (kq) {
      if (kq && !kq.ok) { $('hopOk').disabled = false; $('hopOk').textContent = o.nut; $('hopLoi').textContent = kq.loi; $('hopLoi').classList.remove('an'); return; }
      $('lop').innerHTML = '';
    });
  };
}

/* ---------- bấm ---------- */
document.addEventListener('click', function (ev) {
  var n = ev.target.closest('[data-lam]'); if (!n || st.ban) return;
  var lam = n.getAttribute('data-lam'), ma = n.getAttribute('data-ma');
  var D = {
    tai_lai: function () { $('manChinh').innerHTML = '<div class="cho">⏳ Đang tải… máy chủ có thể mất 5–10 giây, đừng tải lại trang.</div>'; tai(); },
    lam_moi: function () { tai(); },
    man: function () { moMan(ma); },
    loc: function () { st.loc = ma; ve(); },
    mo_muc: function () {
      st.muc = st.muc === ma ? '' : ma; ve();
      if (st.muc) Array.prototype.forEach.call(document.querySelectorAll('[data-lam="mo_muc"]'), function (b) {
        if (b.getAttribute('data-ma') === ma) b.scrollIntoView({ block: 'start', behavior: 'smooth' });
      });
    },
    doc: function () { if (st.doc[ma]) delete st.doc[ma]; else st.doc[ma] = 1; ve(); },
    // ✅ Đã hiểu: đổi NGAY trên màn rồi gửi ngầm; hỏng thì trả dòng về như cũ + nói rõ + nút thử lại. Bấm nhiều lần chỉ một cú.
    da_hieu: function () {
      var x = timDong(ma); if (!x || st.gui[ma]) return;
      var cu = { muc: x.muc, da_doc: x.da_doc };
      st.gui[ma] = 1; delete st.loi_dong[ma];
      danhDauDaHieu(x); ve(); baoNhanh('✅ Đã ghi: bạn đã hiểu tin này');
      goi('tt_da_hieu', { ma_tin: x.ma }).then(function (kq) {
        delete st.gui[ma];
        var y = timDong(ma);
        if (kq.ok) { catNho(); return; }
        if (y) { y.muc = cu.muc; y.da_doc = cu.da_doc; if (y.tin) y.tin.da_hieu = false; }
        st.loi_dong[ma] = 'Chưa ghi được "Đã hiểu" cho tin này: ' + kq.loi;
        baoNhanh('⚠️ Chưa ghi được "Đã hiểu" — xem dòng báo đỏ ở tin đó');
        if (st.man === 'hop') ve();
      });
    },
    // Mở ›: đi tới trang của hệ kia (thẻ <a> tự chuyển trang), đồng thời ghi "đã đọc" — gửi kiểu keepalive để chuyển trang không cắt mất.
    mo_tb: function () {
      var x = timDong(ma); if (!x || x.da_doc) return;
      x.da_doc = true; catNho();
      try {
        fetch(URL_TRUNG_TAM, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ hanh_dong: 'tb_da_doc', phien: layPhien(), nguon: x.nguon, ma: x.ma }) }).catch(function () {});
      } catch (z) {}
    },
    // đăng tin
    dg_moi: function () { st.dg = dgMoi(); ve(); },
    dg_tu_viet: function () { st.dg = dgMoi('tu_viet'); st.dg.ban = banTrong(); ve(); },
    dg_loai: function () { var b = st.dg.ban; b.loai = ma; if (ma === 'ke_hoach_tuan' && !b.tuan) b.tuan = thuHai(0); ve(); },
    dg_tuan: function () { st.dg.ban.tuan = ma; ve(); },
    dg_nn: function () { st.dg.nn.kieu = ma; ve(); },
    dg_nhom: function () { var a = st.dg.nn.nhom, i = a.indexOf(ma); if (i >= 0) a.splice(i, 1); else a.push(ma); ve(); },
    dg_phong: function () { var a = st.dg.nn.phong, i = a.indexOf(ma); if (i >= 0) a.splice(i, 1); else a.push(ma); ve(); },
    dg_nguoi: function () { var a = st.dg.nn.ma, i = a.indexOf(ma); if (i >= 0) a.splice(i, 1); else a.push(ma); ve(); },
    dg_khan: function () { st.dg.khan = !st.dg.khan; ve(); },
    dg_doc: function () {
      var d = st.dg;
      if (d.buoc === 'nhap') d.nguon = $('dgNguon').value;
      if (d.buoc === 'hoi') d.bo_sung = $('dgBoSung').value;
      if (!d.nguon.trim()) { d.loi = { loi: 'Dán nội dung tin vào ô trước đã.' }; ve(); return; }
      if (d.buoc === 'hoi' && !d.bo_sung.trim()) { d.loi = { loi: 'Ghi câu trả lời cho trợ lý trước đã.' }; ve(); return; }
      cho(n, '⏳ Trợ lý đang đọc…');
      goi('tt_doc', { nguon: d.nguon, ma_luot: d.ma_luot, bo_sung: d.buoc === 'hoi' ? d.bo_sung : '' }).then(function (kq) {
        if (!kq.ok) { d.loi = kq; ve(); return; }
        d.loi = null; d.ma_luot = kq.ma_luot; d.goc = d.nguon; d.ban = nhanBan(kq.ban); d.con_thieu = kq.con_thieu; d.so_la = kq.so_la; d.bo_sung = '';
        d.buoc = kq.trang_thai === 'hoi_them' ? 'hoi' : 'xac_nhan'; ve();
      });
    },
    dg_doc_lai: function () { var d = st.dg; d.buoc = 'hoi'; d.con_thieu = ['Trợ lý đọc sai chỗ nào? Ghi lại cho đúng (vd: "lương là 7tr5, không phải 7tr8").']; d.loi = null; ve(); },
    dg_dang: function () {
      var d = st.dg; cho(n, 'Đang đăng…');
      var p = d.buoc === 'dinh_chinh' ? goi('tt_dinh_chinh', { ma_tin: d.dinh_chinh.ma_tin, ban: banGui(d.ban), ly_do: d.ly_do, ma_yc: d.ma_yc })
        : goi('tt_dang', { ma_luot: d.ma_luot, ban: banGui(d.ban), nguoi_nhan: d.nn, nguoi_duyet: d.duyet, ngay_duyet: d.ngay_duyet, ma_yc: d.ma_yc, khan: d.khan === true });
      p.then(function (kq) {
        if (!kq.ok) { d.loi = kq; ve(); return; }
        d.buoc = 'xong'; d.ket = kq; d.loi = null; st.theo = null; ve(); tai();
      });
    },
    gui_lai: function () { cho(n, 'Đang gửi…'); goi('tt_gui_lai', { ma_tin: ma }).then(function (kq) {
      baoNhanh(kq.ok ? '📤 Đã báo vào nhóm Zalo' : '⚠️ ' + kq.loi); if (kq.ok && st.dg && st.dg.ket) st.dg.ket.zalo = { ok: true }; if (st.man === 'theo') taiTheoDoi(); ve(); }); },
    ai_chua: function () { cho(n, 'Đang xem…'); goi('tt_theo_doi', { ma_tin: ma }).then(function (kq) { if (!kq.ok) { baoNhanh('⚠️ ' + kq.loi); ve(); return; } st.chuaDoc[ma] = kq.chua_doc; ve(); }); },
    nhac_tin: function () { cho(n, 'Đang gửi…'); goi('tt_nhac', { ma_tin: ma }).then(function (kq) { baoNhanh(kq.ok ? '🔔 Đã nhắc vào nhóm: còn ' + kq.so_chua_doc + ' người chưa đọc' : '⚠️ ' + kq.loi); ve(); }); },
    dinh_chinh: function () {
      var t = st.theo.tin.filter(function (x) { return x.ma_tin === ma; })[0]; if (!t) return;
      st.dg = dgMoi('dinh_chinh'); st.dg.dinh_chinh = t; st.dg.ban = {}; Object.keys(banTrong()).forEach(function (k) { st.dg.ban[k] = t[k] || ''; }); nhanBan(st.dg.ban);
      moMan('dang');
    },
    thu_hoi: function () { hopHoi({ tieu: '🗑️ Thu hồi tin này?', mo_ta: 'Tin biến khỏi trang của mọi người (vẫn lưu trong Sheet). Tin sai một phần thì dùng Đính chính.', goi_y: 'Lý do thu hồi', nut: '🗑️ Thu hồi', bat_buoc: 'Ghi lý do thu hồi.',
      xong: function (v) { return goi('tt_thu_hoi', { ma_tin: ma, ly_do: v }).then(function (kq) { if (kq.ok) { baoNhanh('🗑️ Đã thu hồi'); taiTheoDoi(); tai(); } return kq; }); } }); }
  };
  if (D[lam]) D[lam]();
});
document.addEventListener('change', function (ev) { if (ev.target.id) dongBo(ev.target); });
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'dgTimNguoi' && st.dg) { st.dg.tim_nguoi = ev.target.value; var vn = ev.target.selectionStart; ve(); var on = $('dgTimNguoi'); if (on) { on.focus(); on.setSelectionRange(vn, vn); } return; }
  if (ev.target.id === 'hmTim') { st.tim = ev.target.value; var vt = ev.target.selectionStart; ve(); var o = $('hmTim'); if (o) { o.focus(); o.setSelectionRange(vt, vt); } return; }
  if (ev.target.id) dongBo(ev.target);
});
/** Khoá nút vừa bấm + đổi chữ, để người dùng biết đang chạy và không bấm hai lần. */
function cho(n, chu) { n.disabled = true; n.textContent = chu; }

Promise.resolve().then(tai);
</script>
