<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đăng ký lao động</title>
<style>
  :root{
    --nen:#f2f4f6; --the:#fff; --chu:#1b2430; --mo:#8a95a1; --vien:#e6eaee;
    --xanh:#12b76a; --xanh-dam:#0e9257;
    --tot:#0f7a3d; --tot-nen:#e7f7ee;
    --canh:#8a6300; --canh-nen:#fff6e0;
    --loi:#b3261e; --loi-nen:#fdeceb;
    --tv:#0b6b57; --ct:#6b4bbd;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--nen);color:var(--chu);
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .boc{max-width:560px;margin:0 auto;padding:0 0 40px}
  .dau{background:var(--the);text-align:center;padding:16px 14px;border-bottom:1px solid var(--vien)}
  .dau h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.3px}
  .dau p{margin:3px 0 0;font-size:13px;color:var(--mo)}
  .dau .nhan{display:inline-block;margin-top:6px;padding:3px 11px;border-radius:999px;
        font-size:11.5px;font-weight:700;letter-spacing:.5px}
  .dau .nhan.tv{background:#e6f4f0;color:var(--tv)}
  .dau .nhan.ct{background:#efeafa;color:var(--ct)}

  .khoi{background:var(--the);margin-top:10px;border-top:1px solid var(--vien);border-bottom:1px solid var(--vien)}
  .khoi h2{margin:0;padding:11px 16px 3px;font-size:12.5px;font-weight:600;color:var(--mo);
           text-transform:uppercase;letter-spacing:.5px}

  /* hàng kiểu danh sách: nhãn trái, giá trị phải */
  .hang{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:52px;
        border-top:1px solid #f0f2f5}
  .hang:first-of-type{border-top:0}
  .hang > span{flex:0 0 104px;font-size:15px;color:var(--chu)}
  .hang input,.hang select{flex:1;min-width:0;border:0;padding:14px 0;font-size:15.5px;
        font-family:inherit;background:transparent;color:var(--chu);text-align:right}
  .hang input::placeholder{color:#c2cad3}
  .hang input:focus,.hang select:focus{outline:0}
  .hang.sai{background:#fff5f4}
  .hang .doc{flex:1;text-align:right;font-size:15.5px;font-weight:600;word-break:break-word;padding:14px 0}

  .gt{display:flex;gap:18px;justify-content:flex-end;flex:1;padding:11px 0}
  .gt label{display:flex;align-items:center;gap:7px;font-size:15px;margin:0;cursor:pointer}
  .gt input{width:21px;height:21px;flex:none;accent-color:var(--xanh)}

  .nut{display:block;width:calc(100% - 28px);margin:16px 14px 0;padding:15px;
       font-size:16.5px;font-weight:600;font-family:inherit;border:0;border-radius:9px;
       background:var(--xanh);color:#fff;cursor:pointer}
  .nut:active{background:var(--xanh-dam)}
  .nut[disabled]{opacity:.5}
  .nut.phu{background:#eceff3;color:var(--chu)}

  /* chọn mảng */
  .mang{padding:14px}
  .mang button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
        background:var(--the);border:1px solid var(--vien);border-radius:11px;
        padding:18px 16px;margin-bottom:11px;font-family:inherit;cursor:pointer;color:var(--chu)}
  .mang button:active{background:#f6f8fa}
  .mang .cham{flex:0 0 44px;height:44px;border-radius:11px;display:flex;align-items:center;
        justify-content:center;font-size:20px;font-weight:700}
  .mang .tv{background:#e6f4f0;color:var(--tv)} .mang .ct{background:#efeafa;color:var(--ct)}
  .mang b{display:block;font-size:16.5px;margin-bottom:2px}
  .mang small{display:block;font-size:13px;color:var(--mo);font-weight:400;line-height:1.4}

  /* danh sách công ty */
  .ds a{display:flex;align-items:center;justify-content:space-between;gap:10px;
        padding:15px 16px;border-top:1px solid #f0f2f5;text-decoration:none;
        color:var(--chu);font-size:15.5px;font-weight:600}
  .ds a:first-child{border-top:0}
  .ds a:active{background:#f6f8fa}
  .ds a::after{content:'›';color:var(--mo);font-size:22px;font-weight:400}

  /* 3 cách nhập */
  .cach{display:flex;gap:0;background:var(--the);border-top:1px solid var(--vien);
        border-bottom:1px solid var(--vien);margin-top:10px}
  .cach button{flex:1;background:none;border:0;border-left:1px solid #f0f2f5;padding:15px 6px;
        font-family:inherit;cursor:pointer;color:var(--chu)}
  .cach button:first-child{border-left:0}
  .cach button:active{background:#f6f8fa}
  .cach .so{display:block;width:26px;height:26px;line-height:26px;margin:0 auto 7px;
        border-radius:50%;background:var(--xanh);color:#fff;font-size:14px;font-weight:700}
  .cach .ten{display:block;font-size:13.5px;font-weight:600}

  #vungquet{width:100%;background:#000;min-height:260px}
  #anhtam{display:none}
  .nhac{background:#fffbe8;padding:11px 16px;font-size:13px;line-height:1.5;color:#6b5900}
  .loi-o{color:var(--loi);font-size:13px;padding:0 16px 10px;display:none}
  .loi-o.hien{display:block}

  /* dải cảnh báo hiện ngay sau khi quét */
  .canhbao{margin:10px 14px 0;padding:12px 14px;border-radius:9px;font-size:13.5px;line-height:1.5;display:none}
  .canhbao.hien{display:block}
  .canhbao.vang{background:var(--canh-nen);color:#6b4e00;border:1px solid #f0dda0}
  .canhbao.xanh{background:var(--tot-nen);color:#0a5c2f;border:1px solid #b6e2c8}

  .tick{display:flex;gap:11px;align-items:flex-start;padding:14px 16px;font-size:13.5px;
        line-height:1.5;color:var(--mo)}
  .tick input{width:21px;height:21px;flex:none;margin:0;accent-color:var(--xanh)}

  /* màn tình trạng */
  .tt{text-align:center;padding:34px 20px}
  .tt .vong{width:66px;height:66px;border-radius:50%;margin:0 auto 14px;
        display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700}
  .tt.tot .vong{background:var(--tot-nen);color:var(--tot)}
  .tt.canh .vong{background:var(--canh-nen);color:var(--canh)}
  .tt.xau .vong{background:var(--loi-nen);color:var(--loi)}
  .tt h2{margin:0 0 6px;font-size:21px}
  .tt.tot h2{color:var(--tot)} .tt.canh h2{color:var(--canh)} .tt.xau h2{color:var(--loi)}
  .tt p{margin:0 0 4px;color:var(--mo);font-size:14.5px}
  .tt .ma{display:inline-block;margin-top:14px;padding:9px 18px;background:#f2f4f6;
        border-radius:8px;font-size:19px;font-weight:700;letter-spacing:.5px}
  .an{display:none}
</style>
</head>
<body>
<div class="boc">

<div class="dau">
  <h1 id="ten_ct">ĐĂNG KÝ LAO ĐỘNG</h1>
  <p id="phu_de">Đang tải…</p>
  <span id="nhan_mang" class="nhan an"></span>
</div>

<!-- ===== BƯỚC 1: CHỌN MẢNG ===== -->
<div class="mang an" id="man_mang">
  <button type="button" data-loai="thoi_vu">
    <span class="cham tv">TV</span>
    <span><b>Lao động thời vụ</b><small>Làm theo đợt, theo mùa vụ</small></span>
  </button>
  <button type="button" data-loai="chinh_thuc">
    <span class="cham ct">CT</span>
    <span><b>Lao động chính thức</b><small>Ký hợp đồng dài hạn với công ty</small></span>
  </button>
</div>

<!-- ===== BƯỚC 2: CHỌN CÔNG TY ===== -->
<div class="an" id="man_ct">
  <div class="khoi"><h2 id="tieu_ct">Chọn công ty</h2><div class="ds" id="ds_ct"></div></div>
  <button type="button" class="nut phu" id="nut_doi_mang">Chọn mảng khác</button>
</div>

<!-- ===== BƯỚC 3: 3 CÁCH NHẬP ===== -->
<div class="cach an" id="cach">
  <button type="button" id="c1"><span class="so">1</span><span class="ten">Quét mã</span></button>
  <button type="button" id="c2"><span class="so">2</span><span class="ten">Lấy từ ảnh</span></button>
  <button type="button" id="c3"><span class="so">3</span><span class="ten">Nhập tay</span></button>
</div>
<input type="file" id="file_anh" accept="image/*" class="an">
<div id="anhtam"></div>

<!-- ===== CAMERA ===== -->
<div id="man_quet" class="an">
  <div class="nhac">Đưa mặt thẻ <b>có mã QR</b> vào khung. Thẻ cấp từ 01/7/2024 mã QR ở <b>mặt sau</b>.</div>
  <div id="vungquet"></div>
  <div class="loi-o" id="loi_quet"></div>
  <button type="button" class="nut phu" id="nut_huy">Quay lại</button>
</div>

<!-- ===== BIỂU MẪU ===== -->
<form id="form" class="an">
  <div class="canhbao" id="canh_bao"></div>
  <div class="khoi">
    <div class="hang" id="hang_ct">
      <span>Công ty</span>
      <select id="ma_ct"><option value="">Vui lòng chọn</option></select>
    </div>
    <div class="hang"><span>Họ và tên</span><input id="ho_ten" placeholder="Nhập họ tên" autocomplete="off"></div>
    <div class="hang"><span>Số CCCD</span><input id="so_cccd" inputmode="numeric" maxlength="14" placeholder="12 chữ số" autocomplete="off"></div>
    <div class="hang"><span>Ngày sinh</span><input id="ngay_sinh" inputmode="numeric" maxlength="10" placeholder="01/01/1990"></div>
    <div class="hang"><span>Giới tính</span>
      <div class="gt">
        <label><input type="radio" name="gt" value="Nam"> Nam</label>
        <label><input type="radio" name="gt" value="Nữ"> Nữ</label>
      </div>
    </div>
    <div class="hang"><span>Điện thoại</span><input id="sdt" inputmode="tel" maxlength="15" placeholder="Nhập số điện thoại" autocomplete="off"></div>
    <div class="hang"><span>Thường trú</span><input id="noi_thuong_tru" placeholder="Theo thẻ căn cước" autocomplete="off"></div>
    <div class="hang"><span>Ghi chú</span><input id="ghi_chu" placeholder="Không bắt buộc" autocomplete="off"></div>
    <div class="hang"><span>Người nhập</span><input id="nguoi_nhap" placeholder="Tên bạn" autocomplete="off"></div>
  </div>

  <div class="loi-o" id="loi_form"></div>

  <div class="khoi">
    <label class="tick"><input type="checkbox" id="dong_y">
      <span>Người đăng ký đồng ý cho xử lý <b>số CCCD, họ tên, ngày sinh, nơi thường trú, số điện thoại</b>
      nhằm mục đích tuyển dụng và điều phối đón lao động; đồng ý gửi <b>họ tên và 4 số cuối CCCD</b>
      vào <b>nhóm nội bộ của đội điều phối</b>; dữ liệu lưu trên <b>Google Sheets (máy chủ ở nước ngoài)</b>
      tối đa <b>90 ngày</b>, có quyền yêu cầu xem, sửa hoặc xoá bất cứ lúc nào.</span></label>
  </div>

  <button type="submit" class="nut" id="nut_dk">Đăng ký</button>
  <button type="button" class="nut phu" id="nut_lai">Chọn cách nhập khác</button>
</form>

<!-- ===== TÌNH TRẠNG ===== -->
<div id="man_tt" class="an"></div>

</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
// ====== CẤU HÌNH ======
var URL_API   = 'https://script.google.com/macros/s/AKfycby1EldZql-1j9H3vaoZdK2e7CfEHZAyyHW-SiTkY4rFWUrb-jHODY68x-OWGVAFlKzU/exec';
var TOKEN_API = 'd905baa65db6457e830d8f40';
// ======================

var $ = function (id) { return document.getElementById(id); };
var maCT = '', tenCT = '', loaiCT = '', qrTho = '', nguonNhap = 'tay', mayQuet = null;
var dsCT = [];
// Hai trường này KHÔNG hiện trên biểu mẫu nhưng vẫn tách từ mã QR và lưu đầy đủ vào Sheet
var ngayCap = '', cmndCu = '';

function hien(el) {
  ['man_mang', 'man_ct', 'cach', 'man_quet', 'form', 'man_tt'].forEach(function (i) { $(i).classList.add('an'); });
  if (el) $(el).classList.remove('an');
  window.scrollTo(0, 0);
}

function goiAPI(body) {
  return fetch(URL_API, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json(); });
}

function thoat(s) {
  return String(s == null ? '' : s).replace(/[<>&]/g, function (m) {
    return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[m];
  });
}

// ---------- Nạp danh sách công ty ----------
maCT = decodeURIComponent((location.search.match(/[?&]ct=([^&]+)/) || [])[1] || '');

goiAPI({ token: TOKEN_API, hanh_dong: 'danh_sach_cong_ty' })
  .then(function (kq) {
    dsCT = (kq && kq.danh_sach) || [];
    var sel = $('ma_ct');
    dsCT.forEach(function (c) {
      var o = document.createElement('option');
      o.value = c.ma_ct; o.textContent = c.ten_cong_ty;
      sel.appendChild(o);
    });
    if (maCT) {
      var tim = dsCT.filter(function (c) { return c.ma_ct.toLowerCase() === maCT.toLowerCase(); })[0];
      if (tim) { chonCongTy(tim); return; }                 // link riêng → vào thẳng bước quét
      alert('Link này không gắn với công ty nào đang tuyển. Bạn chọn thủ công giúp nhé.');
    }
    if (!dsCT.length) { $('phu_de').textContent = 'Chưa khai công ty nào trong hệ thống'; return; }
    $('phu_de').textContent = 'Chọn mảng lao động';
    hien('man_mang');
  })
  .catch(function () { $('phu_de').textContent = 'Không kết nối được máy chủ'; });

// ---------- Bước 1: chọn mảng ----------
[].forEach.call(document.querySelectorAll('#man_mang button'), function (b) {
  b.addEventListener('click', function () { moDanhSachCT(b.getAttribute('data-loai')); });
});

function moDanhSachCT(loai) {
  var nhom = dsCT.filter(function (c) { return c.loai === loai; });
  $('tieu_ct').textContent = (loai === 'thoi_vu' ? 'Thời vụ' : 'Chính thức') + ' — chọn công ty';
  if (!nhom.length) {
    $('ds_ct').innerHTML = '<div style="padding:16px;color:var(--mo);font-size:14.5px">' +
      'Chưa có công ty nào đang tuyển ở mảng này.</div>';
  } else {
    $('ds_ct').innerHTML = nhom.map(function (c) {
      return '<a href="#" data-ma="' + thoat(c.ma_ct) + '">' + thoat(c.ten_cong_ty) + '</a>';
    }).join('');
    [].forEach.call($('ds_ct').querySelectorAll('a'), function (a) {
      a.addEventListener('click', function (ev) {
        ev.preventDefault();
        var m = a.getAttribute('data-ma');
        chonCongTy(dsCT.filter(function (c) { return c.ma_ct === m; })[0]);
      });
    });
  }
  hien('man_ct');
}

$('nut_doi_mang').addEventListener('click', function () { hien('man_mang'); });

// ---------- Bước 2: chốt công ty → sang bước quét ----------
function chonCongTy(c) {
  if (!c) return;
  maCT = c.ma_ct; tenCT = c.ten_cong_ty; loaiCT = c.loai;
  $('ten_ct').textContent = tenCT.toUpperCase();
  $('phu_de').textContent = 'Chọn cách lấy thông tin lao động';
  var n = $('nhan_mang');
  n.textContent = loaiCT === 'chinh_thuc' ? 'CHÍNH THỨC' : 'THỜI VỤ';
  n.className = 'nhan ' + (loaiCT === 'chinh_thuc' ? 'ct' : 'tv');
  $('ma_ct').value = maCT;
  $('hang_ct').classList.add('an');     // đã biết công ty thì ẩn hàng chọn cho gọn
  hien('cach');
}

// ---------- Nhớ tên người nhập ----------
try { var l = localStorage.getItem('nguoi_nhap'); if (l) $('nguoi_nhap').value = l; } catch (e) {}

// ---------- Tách chuỗi QR trên thẻ căn cước ----------
// 7 trường ngăn bằng dấu |: sốCCCD | sốCMND9 | họ tên | ddMMyyyy sinh | giới tính | nơi thường trú | ddMMyyyy cấp
// Thẻ mẫu 2024 có thể dư trường → đọc được bao nhiêu lấy bấy nhiêu, không bao giờ báo hỏng.
// LẤY ĐỦ CẢ 7 TRƯỜNG dù biểu mẫu chỉ hiện một phần — số CMND cũ và ngày cấp vẫn lưu vào Sheet.
function tachQR(chuoi) {
  var p = String(chuoi).split('|');
  var ngay = function (s) {
    var d = String(s || '').replace(/\D/g, '');
    return d.length === 8 ? d.substring(0, 2) + '/' + d.substring(2, 4) + '/' + d.substring(4) : '';
  };
  var g = String(p[4] || '').trim();
  return {
    so_cccd: String(p[0] || '').replace(/\D/g, ''),
    cmnd_cu: String(p[1] || '').replace(/\D/g, ''),
    ho_ten: String(p[2] || '').replace(/\s+/g, ' ').trim(),
    ngay_sinh: ngay(p[3]),
    gioi_tinh: /^n[ữu]/i.test(g) ? 'Nữ' : (/^nam/i.test(g) ? 'Nam' : ''),
    noi_thuong_tru: String(p[5] || '').replace(/\s+/g, ' ').trim(),
    ngay_cap: ngay(p[6])
  };
}

function nhanQR(chuoi, nguon) {
  qrTho = chuoi; nguonNhap = nguon;
  var t = tachQR(chuoi);
  if (!t.so_cccd || t.so_cccd.length !== 12) {
    alert('Mã vừa quét không phải thẻ căn cước.\n\nThử lại, hoặc chọn cách 3 để nhập tay.');
    hien('cach'); return;
  }
  $('so_cccd').value = t.so_cccd;
  if (t.ho_ten) $('ho_ten').value = t.ho_ten;
  if (t.ngay_sinh) $('ngay_sinh').value = t.ngay_sinh;
  if (t.noi_thuong_tru) $('noi_thuong_tru').value = t.noi_thuong_tru;
  if (t.gioi_tinh) {
    var r = document.querySelector('input[name=gt][value="' + t.gioi_tinh + '"]');
    if (r) r.checked = true;
  }
  ngayCap = t.ngay_cap; cmndCu = t.cmnd_cu;   // đi ngầm, vẫn lưu vào Sheet
  hien('form');
  traTinhTrang(t.so_cccd);                    // báo trùng/báo chéo NGAY, không bắt điền hết form
  $('sdt').focus();
}

// ---------- Tra tình trạng ngay sau khi quét (không ghi gì lên Sheet) ----------
function traTinhTrang(cccd) {
  var o = $('canh_bao');
  o.className = 'canhbao'; o.textContent = '';
  goiAPI({ token: TOKEN_API, hanh_dong: 'kiem_tra', so_cccd: cccd, ma_ct: maCT })
    .then(function (kq) {
      if (!kq.ok) return;
      if (kq.ma === 'TRUNG') {
        // Đang bị khoá → hiện thẳng màn tình trạng, khỏi bắt điền tiếp cho phí công
        veTinhTrang({ ok: true, ma: 'TRUNG', ho_ten: kq.ho_ten, ma_ld: kq.ma_ld,
                      ngay_dk: kq.ngay_dk, loi: kq.loi, con_khoa_ngay: kq.con_khoa_ngay,
                      canh_bao_cheo: kq.canh_bao_cheo });
        return;
      }
      var tin = '';
      if (kq.ma === 'CHO_DANG_KY_LAI') {
        tin += '<b>Người này đã từng đăng ký</b> (' + thoat(kq.ma_ld) + ', ' +
               (kq.trang_thai_cu === 'da_don' ? 'đã được đón' : 'chưa đón') +
               '). Đã quá hạn khoá nên <b>đăng ký lại được</b>.';
      }
      if (kq.canh_bao_cheo) tin += (tin ? '<br>' : '') + '(!) ' + thoat(kq.canh_bao_cheo);
      if (tin) {
        o.innerHTML = tin;
        o.className = 'canhbao hien ' + (kq.canh_bao_cheo ? 'vang' : 'xanh');
      }
    })
    .catch(function () { /* không tra được thì thôi, lúc bấm Đăng ký backend vẫn kiểm lại */ });
}

// ---------- 1. Quét mã ----------
$('c1').addEventListener('click', function () {
  if (typeof Html5Qrcode === 'undefined') { alert('Chưa tải được bộ quét mã. Dùng cách 3 để nhập tay.'); return; }
  hien('man_quet');
  $('loi_quet').classList.remove('hien');
  mayQuet = new Html5Qrcode('vungquet');
  mayQuet.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 250, height: 250 } },
    function (text) { dungQuet(function () { nhanQR(text, 'qr_camera'); }); },
    function () {}
  ).catch(function (e) {
    mayQuet = null;
    var o = $('loi_quet');
    o.textContent = 'Không mở được camera: ' + e + '. Kiểm tra quyền camera, hoặc dùng cách 2 / cách 3.';
    o.classList.add('hien');
  });
});

function dungQuet(xong) {
  if (!mayQuet) { if (xong) xong(); return; }
  var m = mayQuet; mayQuet = null;
  m.stop().then(function () { try { m.clear(); } catch (e) {} if (xong) xong(); })
          .catch(function () { if (xong) xong(); });
}
$('nut_huy').addEventListener('click', function () { dungQuet(function () { hien('cach'); }); });

// ---------- 2. Lấy từ ảnh (ảnh KHÔNG rời khỏi máy) ----------
$('c2').addEventListener('click', function () {
  if (typeof Html5Qrcode === 'undefined') { alert('Chưa tải được bộ quét mã. Dùng cách 3 để nhập tay.'); return; }
  $('file_anh').click();
});
$('file_anh').addEventListener('change', function () {
  var f = this.files && this.files[0]; this.value = '';
  if (!f) return;
  // Giải mã trong khối riêng #anhtam; tham số false = KHÔNG vẽ ảnh ra màn hình
  var doc = new Html5Qrcode('anhtam');
  doc.scanFile(f, false)
    .then(function (t) { try { doc.clear(); } catch (e) {} f = null; nhanQR(t, 'qr_anh'); })
    .catch(function () {
      try { doc.clear(); } catch (e) {}
      f = null;
      alert('Không đọc được mã QR trong ảnh.\n\nChụp rõ và thẳng mặt thẻ có mã QR, tránh loá đèn. Hoặc dùng cách 3.');
    });
});

// ---------- 3. Nhập tay ----------
$('c3').addEventListener('click', function () {
  qrTho = ''; nguonNhap = 'tay'; ngayCap = ''; cmndCu = '';
  $('canh_bao').className = 'canhbao';
  hien('form'); $('ho_ten').focus();
});
$('nut_lai').addEventListener('click', function () { hien('cach'); });

// Nhập tay đủ 12 số cũng tra tình trạng luôn
$('so_cccd').addEventListener('blur', function () {
  var c = this.value.replace(/\D/g, '');
  if (c.length === 12 && maCT) traTinhTrang(c);
});

// tự chèn dấu / cho ngày sinh
$('ngay_sinh').addEventListener('input', function () {
  var s = this.value.replace(/\D/g, '').substring(0, 8);
  this.value = s.length > 4 ? s.substring(0, 2) + '/' + s.substring(2, 4) + '/' + s.substring(4)
             : s.length > 2 ? s.substring(0, 2) + '/' + s.substring(2) : s;
});

// ---------- Gửi ----------
$('form').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var loi = '', cccd = $('so_cccd').value.replace(/\D/g, ''),
      ten = $('ho_ten').value.trim().replace(/\s+/g, ' '),
      ct = $('ma_ct').value;
  if (!ct) loi = 'Chưa chọn công ty';
  else if (ten.length < 3 || ten.indexOf(' ') < 0) loi = 'Nhập đầy đủ họ và tên';
  else if (cccd.length !== 12) loi = cccd.length ? 'Số CCCD đang có ' + cccd.length + ' chữ số, cần đúng 12' : 'Chưa nhập số CCCD';
  else if (!$('dong_y').checked) loi = 'Cần tích ô đồng ý mới đăng ký được';
  var o = $('loi_form');
  o.textContent = loi; o.classList.toggle('hien', !!loi);
  if (loi) { o.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }

  var nut = $('nut_dk');
  nut.disabled = true; nut.textContent = 'Đang gửi…';
  var gt = document.querySelector('input[name=gt]:checked');
  var d = {
    token: TOKEN_API, hanh_dong: 'dang_ky', ma_ct: ct,
    so_cccd: cccd, ho_ten: ten,
    ngay_sinh: $('ngay_sinh').value.trim(),
    gioi_tinh: gt ? gt.value : '',
    sdt: $('sdt').value.replace(/\D/g, ''),
    noi_thuong_tru: $('noi_thuong_tru').value.trim(),
    ghi_chu: $('ghi_chu').value.trim(),
    nguoi_nhap: $('nguoi_nhap').value.trim(),
    ngay_cap: ngayCap, cmnd_cu: cmndCu,      // không hiện trên form nhưng vẫn lưu để đối chiếu
    nguon_nhap: nguonNhap, qr_tho: qrTho, dong_y: true
  };
  try { localStorage.setItem('nguoi_nhap', d.nguoi_nhap); } catch (e) {}

  goiAPI(d).then(function (kq) {
    veTinhTrang(kq);
    goiAPI({ token: TOKEN_API, hanh_dong: 'gui_tin' }).catch(function () {});
  }).catch(function () {
    veTinhTrang({ ok: false, loi: 'Không gửi được. Kiểm tra mạng rồi bấm Đăng ký lại.' });
    nut.disabled = false; nut.textContent = 'Đăng ký';
  });
});

function veTinhTrang(kq) {
  var loai, dau, tieu, mo = '', ma = kq.ma_ld || '';
  if (kq.ok && kq.ma === 'THANH_CONG')       { loai = 'tot';  dau = '✓'; tieu = 'Đăng ký thành công'; mo = kq.ho_ten + ' — ' + kq.cccd_che; }
  else if (kq.ok && kq.ma === 'DANG_KY_LAI') { loai = 'tot';  dau = '✓'; tieu = 'Đã đăng ký lại';     mo = kq.ho_ten + ' — lần trước ' + kq.ma_lan_truoc + ' đã kết thúc'; }
  else if (kq.ok && kq.ma === 'TRUNG')       { loai = 'canh'; dau = '!'; tieu = 'Chưa đăng ký lại được';
                                               mo = kq.ho_ten + (kq.con_khoa_ngay ? ' — còn ' + kq.con_khoa_ngay + ' ngày nữa mới đăng ký lại được' : ''); }
  else                                        { loai = 'xau';  dau = '×'; tieu = 'Chưa đăng ký được'; mo = kq.loi || 'Có lỗi xảy ra'; ma = ''; }

  var them = '';
  if (kq.ma === 'TRUNG' && kq.loi) them += '<p>' + thoat(kq.loi) + '</p>';
  if (kq.ten_cong_ty) them += '<p>' + thoat(kq.ten_cong_ty) + '</p>';
  if (kq.canh_bao_cheo) them += '<p style="color:var(--canh)">(!) ' + thoat(kq.canh_bao_cheo) + '</p>';

  $('man_tt').className = 'tt ' + loai;
  $('man_tt').innerHTML =
    '<div class="vong">' + dau + '</div><h2>' + tieu + '</h2>' +
    '<p>' + thoat(mo) + '</p>' + them +
    (ma ? '<div class="ma">' + thoat(ma) + '</div>' : '') +
    '<button type="button" class="nut" onclick="location.reload()">Đăng ký người tiếp theo</button>';
  hien('man_tt');
}
</script>
</body>
</html>
