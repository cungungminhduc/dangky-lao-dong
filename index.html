<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đăng ký lao động</title>
<style>
  :root{
    --nen:#f2f4f6; --the:#fff; --chu:#1b2430; --mo:#9aa3ad; --vien:#e9edf1;
    --xanh:#12b76a; --xanh-dam:#0e9257;
    --tot:#0f7a3d; --tot-nen:#e7f7ee;
    --canh:#8a6300; --canh-nen:#fff6e0;
    --loi:#b3261e; --loi-nen:#fdeceb;
    --tv:#0b6b57; --ct:#6b4bbd;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--nen);color:var(--chu);
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .boc{max-width:560px;margin:0 auto;padding-bottom:30px}

  /* ===== thanh trên cùng: nút ảnh | tên nhà máy | nút QR ===== */
  .dinh{background:var(--the);display:flex;align-items:center;gap:12px;
        padding:14px 16px;border-bottom:1px solid var(--vien)}
  .dinh .bieu{flex:0 0 46px;height:46px;border:0;border-radius:10px;background:#f2f4f6;
        display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .dinh .bieu:active{background:#e4e8ec}
  .dinh .bieu svg{width:25px;height:25px;stroke:#3c4650;fill:none;stroke-width:1.8;
        stroke-linecap:round;stroke-linejoin:round}
  .dinh .giua{flex:1;min-width:0;text-align:center}
  .dinh .giua b{display:block;font-size:17px;font-weight:700;letter-spacing:.3px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dinh .giua span{display:inline-block;margin-top:3px;padding:2px 10px;border-radius:999px;
        font-size:10.5px;font-weight:700;letter-spacing:.6px}
  .dinh .giua span.tv{background:#e6f4f0;color:var(--tv)}
  .dinh .giua span.ct{background:#efeafa;color:var(--ct)}
  .goiquet{text-align:center;font-size:12.5px;color:var(--mo);background:var(--the);
        padding:0 16px 11px;border-bottom:1px solid var(--vien)}

  /* ===== khối biểu mẫu kiểu danh sách ===== */
  .khoi{background:var(--the);margin-top:10px;border-top:1px solid var(--vien);border-bottom:1px solid var(--vien)}
  .hang{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:54px;
        border-top:1px solid #f2f4f6}
  .hang:first-child{border-top:0}
  .hang > span{flex:0 0 108px;font-size:15px}
  .hang input,.hang select{flex:1;min-width:0;border:0;padding:15px 0;font-size:15.5px;
        font-family:inherit;background:transparent;color:var(--chu);text-align:right;
        -webkit-appearance:none;appearance:none}
  .hang select{direction:rtl}
  .hang input::placeholder{color:#c6ced6}
  .hang input:focus,.hang select:focus{outline:0}
  .hang.sai{background:#fff5f4}

  .gt{display:flex;gap:20px;justify-content:flex-end;flex:1;padding:12px 0}
  .gt label{display:flex;align-items:center;gap:8px;font-size:15px;margin:0;cursor:pointer}
  .gt input{width:23px;height:23px;flex:none;accent-color:var(--xanh)}

  .nut{display:block;width:calc(100% - 28px);margin:18px 14px 0;padding:16px;
       font-size:17px;font-weight:600;font-family:inherit;border:0;border-radius:9px;
       background:var(--xanh);color:#fff;cursor:pointer}
  .nut:active{background:var(--xanh-dam)}
  .nut[disabled]{opacity:.5}
  .nut.phu{background:#eceff3;color:var(--chu)}

  /* nút tròn nổi góc phải */
  .tron{position:fixed;right:14px;bottom:22px;width:82px;height:82px;border-radius:50%;
        background:var(--xanh);color:#fff;border:0;font-family:inherit;font-size:12.5px;
        font-weight:600;line-height:1.25;cursor:pointer;box-shadow:0 4px 14px rgba(18,183,106,.4);z-index:20}
  .tron:active{background:var(--xanh-dam)}

  /* ===== chọn mảng ===== */
  .mang{padding:14px}
  .mang button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
        background:var(--the);border:1px solid var(--vien);border-radius:11px;
        padding:18px 16px;margin-bottom:11px;font-family:inherit;cursor:pointer;color:var(--chu)}
  .mang button:active{background:#f6f8fa}
  .mang .cham{flex:0 0 44px;height:44px;border-radius:11px;display:flex;align-items:center;
        justify-content:center;font-size:19px;font-weight:700}
  .mang .tv{background:#e6f4f0;color:var(--tv)} .mang .ct{background:#efeafa;color:var(--ct)}
  .mang b{display:block;font-size:16.5px;margin-bottom:2px}
  .mang small{display:block;font-size:13px;color:var(--mo);font-weight:400;line-height:1.4}

  #vungquet{width:100%;background:#000;min-height:270px}
  #anhtam{display:none}
  .nhac{background:#fffbe8;padding:11px 16px;font-size:13px;line-height:1.5;color:#6b5900}
  .loi-o{color:var(--loi);font-size:13.5px;padding:10px 16px;display:none;background:var(--loi-nen)}
  .loi-o.hien{display:block}

  .canhbao{margin:10px 14px 0;padding:12px 14px;border-radius:9px;font-size:13.5px;line-height:1.55;display:none}
  .canhbao.hien{display:block}
  .canhbao.vang{background:var(--canh-nen);color:#6b4e00;border:1px solid #f0dda0}
  .canhbao.xanh{background:var(--tot-nen);color:#0a5c2f;border:1px solid #b6e2c8}

  .tick{display:flex;gap:11px;align-items:flex-start;padding:14px 16px;font-size:13px;
        line-height:1.5;color:var(--mo)}
  .tick input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--xanh)}

  /* ===== màn tình trạng ===== */
  .tt{text-align:center;padding:34px 20px}
  .tt .vong{width:66px;height:66px;border-radius:50%;margin:0 auto 14px;
        display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700}
  .tt.tot .vong{background:var(--tot-nen);color:var(--tot)}
  .tt.canh .vong{background:var(--canh-nen);color:var(--canh)}
  .tt.xau .vong{background:var(--loi-nen);color:var(--loi)}
  .tt h2{margin:0 0 6px;font-size:21px}
  .tt.tot h2{color:var(--tot)} .tt.canh h2{color:var(--canh)} .tt.xau h2{color:var(--loi)}
  .tt p{margin:0 0 5px;color:var(--mo);font-size:14.5px}
  .tt .ma{display:inline-block;margin-top:14px;padding:9px 18px;background:#f2f4f6;
        border-radius:8px;font-size:19px;font-weight:700;letter-spacing:.5px}

  /* ===== danh sách đã nhập trong ngày ===== */
  .ds-hang{display:flex;gap:10px;align-items:baseline;padding:13px 16px;border-top:1px solid #f2f4f6;font-size:14.5px}
  .ds-hang:first-child{border-top:0}
  .ds-hang .gio{margin-left:auto;font-size:12.5px;color:var(--mo);white-space:nowrap}
  .trong{padding:26px 16px;text-align:center;color:var(--mo);font-size:14.5px}
  .an{display:none}
</style>
</head>
<body>
<div class="boc">

<!-- ===== BƯỚC 1: CHỌN MẢNG ===== -->
<div class="mang an" id="man_mang">
  <div style="text-align:center;padding:16px 0 18px">
    <b style="font-size:17px">ĐĂNG KÝ LAO ĐỘNG</b>
    <div style="font-size:13px;color:var(--mo);margin-top:3px" id="phu_de">Chọn mảng lao động</div>
  </div>
  <button type="button" data-loai="thoi_vu">
    <span class="cham tv">TV</span>
    <span><b>Lao động thời vụ</b><small>Làm theo đợt, theo mùa vụ</small></span>
  </button>
  <button type="button" data-loai="chinh_thuc">
    <span class="cham ct">CT</span>
    <span><b>Lao động chính thức</b><small>Ký hợp đồng dài hạn với nhà máy</small></span>
  </button>
</div>

<!-- ===== BƯỚC 2: BIỂU MẪU (hiện luôn, quét chỉ là điền hộ) ===== -->
<form id="form" class="an">
  <div class="dinh">
    <button type="button" class="bieu" id="nut_anh" title="Lấy thông tin từ ảnh thẻ">
      <svg viewBox="0 0 24 24"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.1-1.8h8.4L17.3 7h2.2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg>
    </button>
    <span class="giua">
      <b id="ten_ct">ĐĂNG KÝ LAO ĐỘNG</b>
      <span id="nhan_mang" class="an"></span>
    </span>
  </div>
  <div class="goiquet">Bấm <b>máy ảnh</b> ở trên rồi <b>chụp mặt thẻ có mã QR</b> — hệ thống tự điền.
    Chụp được riêng góc có mã QR thì càng chắc. Hoặc điền tay bên dưới.</div>

  <div class="canhbao" id="canh_bao"></div>

  <div class="khoi">
    <div class="hang" id="hang_ct">
      <span>Nhà máy</span>
      <select id="ma_ct"><option value="">Vui lòng chọn nhà máy</option></select>
    </div>
    <div class="hang"><span id="nhan_ngay">Ngày đi làm</span>
      <input id="ngay_lam_pv" inputmode="numeric" maxlength="10" placeholder="dd/mm/yyyy"></div>
    <div class="hang"><span>Tên</span><input id="ho_ten" placeholder="Xin vui lòng nhập tên" autocomplete="off"></div>
    <div class="hang"><span>Giới tính</span>
      <div class="gt">
        <label><input type="radio" name="gt" value="Nam"> Nam</label>
        <label><input type="radio" name="gt" value="Nữ"> Nữ</label>
      </div>
    </div>
    <div class="hang"><span>Ngày sinh</span><input id="ngay_sinh" inputmode="numeric" maxlength="10" placeholder="dd/mm/yyyy"></div>
    <div class="hang"><span>Mobile</span><input id="sdt" inputmode="numeric" maxlength="10" placeholder="10 số, ví dụ 0912345678" autocomplete="off"></div>
    <div class="hang"><span>CCCD</span><input id="so_cccd" inputmode="numeric" maxlength="14" placeholder="Xin vui lòng nhập số CCCD" autocomplete="off"></div>
    <div class="hang"><span>Thường trú</span><input id="noi_thuong_tru" placeholder="Theo thẻ căn cước" autocomplete="off"></div>
    <div class="hang"><span>Ghi chú</span><input id="ghi_chu" placeholder="Xin vui lòng điền vào ghi chú" autocomplete="off"></div>
    <div class="hang"><span>Người tuyển dụng</span><input id="nguoi_nhap" placeholder="Tên bạn" autocomplete="off"></div>
  </div>

  <div class="loi-o" id="loi_form"></div>

  <div class="khoi">
    <label class="tick"><input type="checkbox" id="dong_y">
      <span>Người đăng ký đồng ý cho xử lý <b>số CCCD, họ tên, ngày sinh, nơi thường trú, số điện thoại</b>
      nhằm mục đích tuyển dụng và điều phối đón lao động; đồng ý gửi <b>họ tên và 4 số cuối CCCD</b>
      vào <b>nhóm nội bộ của đội điều phối</b>; dữ liệu lưu trên <b>Google Sheets (máy chủ ở nước ngoài)</b>
      tối đa <b>90 ngày</b>, có quyền yêu cầu xem, sửa hoặc xoá bất cứ lúc nào.</span></label>
  </div>

  <button type="submit" class="nut" id="nut_dk">Xác nhận nộp</button>
  <button type="button" class="nut phu" id="nut_doi_mang">Đổi mảng / nhà máy</button>
</form>

<input type="file" id="file_anh" accept="image/*" class="an">
<div id="anhtam"></div>

<!-- ===== TÌNH TRẠNG ===== -->
<div id="man_tt" class="an"></div>

<!-- ===== DANH SÁCH ĐÃ NHẬP HÔM NAY ===== -->
<div id="man_ds" class="an">
  <div style="text-align:center;padding:16px 0 6px"><b style="font-size:17px">DANH SÁCH HÔM NAY</b>
    <div style="font-size:13px;color:var(--mo);margin-top:3px" id="ds_tom">—</div></div>
  <div class="khoi"><div id="ds_noi"></div></div>
  <button type="button" class="nut phu" id="nut_dong_ds">Quay lại đăng ký</button>
</div>

</div>

<button type="button" class="tron an" id="nut_ds">Xem danh sách tổng</button>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<!-- jsQR: bộ giải ăn thẳng ImageData nên nhanh gấp chục lần scanFile,
     nhờ vậy mới dò được hàng chục vùng mà vẫn kịp. -->
<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
// ====== CẤU HÌNH ======
var URL_API   = 'https://script.google.com/macros/s/AKfycby1EldZql-1j9H3vaoZdK2e7CfEHZAyyHW-SiTkY4rFWUrb-jHODY68x-OWGVAFlKzU/exec';
var TOKEN_API = 'd905baa65db6457e830d8f40';
// ======================

var $ = function (id) { return document.getElementById(id); };
var maCT = '', tenCT = '', loaiCT = '', qrTho = '', nguonNhap = 'tay';
var dsCT = [], ngayCap = '', cmndCu = '';

function hien(el) {
  ['man_mang', 'form', 'man_tt', 'man_ds'].forEach(function (i) { $(i).classList.add('an'); });
  if (el) $(el).classList.remove('an');
  $('nut_ds').classList.toggle('an', el !== 'form');
  window.scrollTo(0, 0);
}

function goiAPI(body) {
  return fetch(URL_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                          body: JSON.stringify(body) }).then(function (r) { return r.json(); });
}

function thoat(s) {
  return String(s == null ? '' : s).replace(/[<>&]/g, function (m) {
    return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[m];
  });
}

/**
 * Số điện thoại di động Việt Nam: ĐÚNG 10 chữ số, bắt đầu bằng 0, số thứ hai là 3/5/7/8/9.
 * Cả tính năng "gửi danh sách tên + SĐT cho người đón gọi" sống chết ở chỗ số gọi được.
 */
function sdtHopLe(s) { return /^0[35789]\d{8}$/.test(String(s || '')); }

/**
 * Kiểm ngày dd/mm/yyyy có THẬT SỰ tồn tại không — chặn 31/02, 45/13…
 * Trả về số ngày cách hôm nay (âm = quá khứ), hoặc null nếu ngày sai.
 */
function ngayCachHomNay(s) {
  var m = String(s || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return null;
  var ng = +m[1], th = +m[2], nam = +m[3];
  var d = new Date(nam, th - 1, ng);
  // Ngày không tồn tại thì Date tự nhảy sang tháng sau — bắt bằng cách đối chiếu lại
  if (d.getDate() !== ng || d.getMonth() !== th - 1 || d.getFullYear() !== nam) return null;
  var nay = new Date(); nay.setHours(0, 0, 0, 0);
  return Math.round((d - nay) / 86400000);
}
function loiSdt(s) {
  s = String(s || '');
  if (!s) return 'Chưa nhập số điện thoại';
  if (s.length !== 10) return 'Số điện thoại phải đúng 10 chữ số, đang có ' + s.length + ' số';
  return 'Số điện thoại phải bắt đầu bằng 03, 05, 07, 08 hoặc 09';
}

// ---------- Nạp danh sách nhà máy ----------
maCT = decodeURIComponent((location.search.match(/[?&]ct=([^&]+)/) || [])[1] || '');

goiAPI({ token: TOKEN_API, hanh_dong: 'danh_sach_cong_ty' })
  .then(function (kq) {
    dsCT = (kq && kq.danh_sach) || [];
    if (maCT) {
      var tim = dsCT.filter(function (c) { return c.ma_ct.toLowerCase() === maCT.toLowerCase(); })[0];
      if (tim) { chonMang(tim.loai); chonNhaMay(tim); return; }
      alert('Link này không gắn với nhà máy nào đang tuyển. Bạn chọn thủ công giúp nhé.');
    }
    if (!dsCT.length) { $('phu_de').textContent = 'Chưa khai nhà máy nào trong hệ thống'; }
    hien('man_mang');
  })
  .catch(function () { $('phu_de').textContent = 'Không kết nối được máy chủ'; hien('man_mang'); });

// ---------- Bước 1: chọn mảng ----------
[].forEach.call(document.querySelectorAll('#man_mang button'), function (b) {
  b.addEventListener('click', function () { chonMang(b.getAttribute('data-loai')); hien('form'); });
});

function chonMang(loai) {
  loaiCT = loai;
  var n = $('nhan_mang');
  n.textContent = loai === 'chinh_thuc' ? 'CHÍNH THỨC' : 'THỜI VỤ';
  n.className = loai === 'chinh_thuc' ? 'ct' : 'tv';
  // nạp lại danh sách nhà máy, chỉ của mảng vừa chọn
  var sel = $('ma_ct');
  sel.innerHTML = '<option value="">Vui lòng chọn nhà máy</option>';
  dsCT.filter(function (c) { return c.loai === loai; }).forEach(function (c) {
    var o = document.createElement('option');
    o.value = c.ma_ct; o.textContent = c.ten_cong_ty;
    sel.appendChild(o);
  });
  $('hang_ct').classList.remove('an');
  $('ten_ct').textContent = loai === 'chinh_thuc' ? 'LAO ĐỘNG CHÍNH THỨC' : 'LAO ĐỘNG THỜI VỤ';
  // MỘT ô ngày duy nhất, đổi nhãn theo mảng: chính thức thì đó là ngày PHỎNG VẤN,
  // thời vụ thì là ngày ĐI LÀM. Người nhập không phải phân vân điền ô nào,
  // và không còn cảnh bỏ trống cả hai ô như trước.
  $('nhan_ngay').textContent = loai === 'chinh_thuc' ? 'Ngày phỏng vấn' : 'Ngày đi làm';
  maCT = ''; tenCT = '';
}

function chonNhaMay(c) {
  if (!c) return;
  maCT = c.ma_ct; tenCT = c.ten_cong_ty;
  $('ma_ct').value = maCT;
  $('ten_ct').textContent = tenCT.toUpperCase();
  hien('form');
}

$('ma_ct').addEventListener('change', function () {
  var c = dsCT.filter(function (x) { return x.ma_ct === this.value; }.bind(this))[0];
  if (c) { maCT = c.ma_ct; tenCT = c.ten_cong_ty; $('ten_ct').textContent = tenCT.toUpperCase(); }
  else { maCT = ''; $('ten_ct').textContent = loaiCT === 'chinh_thuc' ? 'LAO ĐỘNG CHÍNH THỨC' : 'LAO ĐỘNG THỜI VỤ'; }
  var c2 = $('so_cccd').value.replace(/\D/g, '');
  if (maCT && c2.length === 12) traTinhTrang(c2);
});

$('nut_doi_mang').addEventListener('click', function () { hien('man_mang'); });

try { var l = localStorage.getItem('nguoi_nhap'); if (l) $('nguoi_nhap').value = l; } catch (e) {}

// Mở trang là hỏi ngay: có phiếu nào lần trước gửi hỏng còn treo không?
setTimeout(xemPhieuCho, 400);

// ---------- Tách chuỗi QR trên thẻ căn cước ----------
// 7 trường ngăn bằng |: sốCCCD | sốCMND9 | họ tên | ddMMyyyy sinh | giới tính | nơi thường trú | ddMMyyyy cấp
// Lấy ĐỦ cả 7 trường; số CMND cũ và ngày cấp không hiện trên biểu mẫu nhưng vẫn lưu vào Sheet.
function tachQR(chuoi) {
  var s = String(chuoi == null ? '' : chuoi).trim();
  var p = s.split('|');

  // KHÔNG tin tuyệt đối rằng ô đầu tiên là số căn cước.
  // Thẻ đời mới (từ 01/7/2024) hoặc máy đọc chèn thêm tiền tố sẽ làm lệch cả 7 ô.
  // Cách chắc: tìm ô nào ĐÚNG 12 chữ số rồi coi ô đó là mốc, cắt bỏ phần thừa phía trước.
  for (var i = 0; i < p.length && i < 4; i++) {
    if (/^\s*\d{12}\s*$/.test(p[i])) { if (i > 0) p = p.slice(i); break; }
  }

  var ngay = function (s2) {
    var d = String(s2 || '').replace(/\D/g, '');
    return d.length === 8 ? d.substring(0, 2) + '/' + d.substring(2, 4) + '/' + d.substring(4) : '';
  };

  var cccd = String(p[0] || '').replace(/\D/g, '');
  // Vẫn không ra 12 số → vớt vát: nhặt cụm 12 chữ số bất kỳ trong cả chuỗi.
  // Thà lấy được mỗi số căn cước còn hơn bắt cộng tác viên gõ lại từ đầu.
  if (cccd.length !== 12) {
    var v = s.match(/(?:^|\D)(\d{12})(?:\D|$)/);
    if (v) return { so_cccd: v[1], cmnd_cu: '', ho_ten: '', ngay_sinh: '',
                    gioi_tinh: '', noi_thuong_tru: '', ngay_cap: '' };
  }

  var g = String(p[4] || '').trim();
  return {
    so_cccd: cccd,
    cmnd_cu: String(p[1] || '').replace(/\D/g, ''),
    ho_ten: String(p[2] || '').replace(/\s+/g, ' ').trim(),
    ngay_sinh: ngay(p[3]),
    gioi_tinh: /^n[ữu]/i.test(g) ? 'Nữ' : (/^nam/i.test(g) ? 'Nam' : ''),
    noi_thuong_tru: String(p[5] || '').replace(/\s+/g, ' ').trim(),
    ngay_cap: ngay(p[6])
  };
}

/** Đọc được QR → tự điền vào biểu mẫu. Không đọc được → báo rõ là phải điền tay. */
function nhanQR(chuoi, nguon) {
  var t = tachQR(chuoi);
  if (!t.so_cccd || t.so_cccd.length !== 12) {
    hien('form');
    baoDai('vang', '<b>Không đọc được mã QR trên thẻ.</b><br>' +
      'Thẻ đời cũ có thể không có mã QR, hoặc mã bị mờ/xước. ' +
      '<b>Bạn điền tay các ô bên dưới giúp nhé.</b>');
    return;
  }
  qrTho = chuoi; nguonNhap = nguon;
  $('so_cccd').value = t.so_cccd;
  if (t.ho_ten) $('ho_ten').value = t.ho_ten;
  if (t.ngay_sinh) $('ngay_sinh').value = t.ngay_sinh;
  if (t.noi_thuong_tru) $('noi_thuong_tru').value = t.noi_thuong_tru;
  if (t.gioi_tinh) {
    var r = document.querySelector('input[name=gt][value="' + t.gioi_tinh + '"]');
    if (r) r.checked = true;
  }
  ngayCap = t.ngay_cap; cmndCu = t.cmnd_cu;
  hien('form');
  baoDai('xanh', '<b>Đã đọc thẻ và tự điền xong.</b> Soát lại rồi bổ sung số điện thoại giúp nhé.');
  if (maCT) traTinhTrang(t.so_cccd);
  $('sdt').focus();
}

function baoDai(mau, html) {

  o.innerHTML = html;
  o.className = 'canhbao hien ' + mau;
}

// ---------- Tra tình trạng (chỉ tra, không ghi) ----------
function traTinhTrang(cccd) {
  goiAPI({ token: TOKEN_API, hanh_dong: 'kiem_tra', so_cccd: cccd, ma_ct: maCT })
    .then(function (kq) {
      if (!kq.ok) return;
      if (kq.ma === 'TRUNG') { veTinhTrang(kq); return; }
      var tin = '';
      if (kq.ma === 'CAN_XAC_NHAN') {
        baoDai('vang', '<b>Người này vừa đăng ký ở công ty khác:</b><br>' + thoat(kq.trung_voi) +
          '<br>Vẫn đăng ký được — bấm <b>Xác nhận nộp</b> rồi máy sẽ hỏi lại một lần nữa.');
        return;
      }
      if (kq.ma === 'CHO_DANG_KY_LAI') {
        tin = '<b>Người này đã từng đăng ký</b> (' + thoat(kq.ma_ld) + ', ' +
              (kq.trang_thai_cu === 'da_don' ? 'đã được đón' : 'chưa đón') +
              ', do "' + thoat(kq.nguoi_nhap_cu) + '" đăng ký). Đã quá hạn khoá nên <b>đăng ký lại được</b>.';
      }
      if (kq.canh_bao_cheo) tin += (tin ? '<br>' : '') + '(!) ' + thoat(kq.canh_bao_cheo);
      if (tin) baoDai(kq.canh_bao_cheo ? 'vang' : 'xanh', tin);
    })
    .catch(function () {});
}

// ---------- Nút máy ảnh: lấy từ ảnh thẻ (ảnh KHÔNG rời khỏi máy) ----------

});

/**
 * Đọc mã trong ẢNH bằng BỐN cách, thử lần lượt tới khi được.
 * Bản cũ chỉ thử đúng một lượt rồi bỏ cuộc — mã QR thẻ căn cước in đè lên hoa văn nền,
 * lại hay bị loá và chụp xa, nên một lượt trượt là chuyện thường.
 * TOÀN BỘ chạy trong máy người dùng, ảnh KHÔNG rời khỏi máy (NĐ 356/2025).
 */
function docAnhNhieuLuot(nguon) { return giaiMaTuNguon(nguon, function () {}); }

/* ============================================================================
 * BỘ ĐỌC MÃ QR THẺ CĂN CƯỚC — bản 3.0
 *
 * Vì sao phải viết lại: bản cũ dò 9 ô theo TỈ LỆ ẢNH (ảnh dọc → ô dọc dài ngoẵng,
 * ô mã chỉ chiếm một góc nhỏ trong đó nên bộ giải mù), và tệ hơn: hễ máy có sẵn
 * BarcodeDetector là nó BỎ LUÔN thư viện ZXing — trên Android chỉ còn MỘT bộ giải.
 *
 * Bản này làm ba chặng, rẻ trước đắt sau, ra kết quả là dừng:
 *   Chặng A — DÒ Ô ĐỊNH VỊ (finder pattern 1:1:3:1:1) để biết mã nằm ĐÂU,
 *             rồi cắt sát quanh đó. Đây là cách máy quét thật vẫn làm.
 *             Đo trên ảnh thật: chỉ giải được khi ô mã chiếm ≥ ~50% khung cắt.
 *   Chặng B — ZXing (đúng bộ Zalo dùng) trên vùng tốt nhất của mỗi cụm mốc.
 *             Chậm ~1,1 giây/lượt nên chỉ chạy tối đa 4 lượt.
 *   Chặng C — quét lưới Ô VUÔNG toàn ảnh, phòng khi dò mốc trượt.
 *
 * Mỗi vùng thử lần lượt 5 cách xử lý ảnh:
 *   gốc · kênh sáng nhất · mượt+sáng nhất · ngưỡng cục bộ · mượt+cục bộ
 * "Kênh sáng nhất" = lấy max(R,G,B) thay cho xám thường: nền bảo an thẻ căn cước
 * in màu xanh lơ, xám thường bóp tương phản mã xuống, max(R,G,B) thì không.
 * "Mượt" = làm nhoè nhẹ, cứu các thẻ đã mòn/rỗ mặt.
 *
 * Đo thật trên 7 ảnh thẻ Dương gửi, TRÊN MÁY KHÔNG CÓ BarcodeDetector
 * (tức kịch bản tệ nhất, chỉ jsQR + ZXing): 6/7 đọc được, trung bình ~6 giây.
 * Bản cũ chỉ đọc được 1/7. Ảnh còn lại có ô mã rộng vỏn vẹn ~100 điểm ảnh
 * (chưa tới 2,3 điểm cho mỗi ô vuông) — phải chụp gần hơn, không bộ giải nào cứu được.
 * Trên điện thoại Android có sẵn BarcodeDetector (chính là ML Kit của Google,
 * đúng bộ Zalo dùng) còn thêm một bộ giải khoẻ nhất chạy đầu tiên.
 *
 * TOÀN BỘ chạy trong máy người dùng, ảnh KHÔNG rời khỏi máy (NĐ 356/2025).
 * ========================================================================== */

/**
 * HẠN GIỜ CỨNG. Không có nó thì ảnh không đọc nổi sẽ dò hết mọi vùng × mọi chế độ —
 * đo thật: quá 10 phút mới chịu thua, cộng tác viên tưởng máy treo và tắt trang.
 * Đo trên 7 ảnh thẻ thật: ca đọc được chậm nhất mất 13,6 giây, nên để 25 giây là
 * vừa rộng cho ca khó mà vẫn dừng sớm để người dùng còn kịp chụp lại hoặc điền tay.
 */
var QR_HAN_GIO_MS = 25000;

/** 5 cách xử lý ảnh trước khi giải, xếp từ rẻ tới đắt. */
var CHE_DO_QR = [
  { ten: 'gốc',            xam: 0, mo: 0, cucbo: 0 },
  { ten: 'kênh sáng nhất', xam: 1, mo: 0, cucbo: 0 },
  { ten: 'mượt+sáng nhất', xam: 1, mo: 1, cucbo: 0 },
  { ten: 'ngưỡng cục bộ',  xam: 1, mo: 0, cucbo: 1 },
  { ten: 'mượt+cục bộ',    xam: 1, mo: 1, cucbo: 1 }
];

/**
 * Cắt vùng {sx,sy,sw,sh} rồi đưa cạnh dài về v.norm điểm ảnh (phóng to HOẶC thu nhỏ).
 * Phóng to không tạo thêm chi tiết, nhưng khi ảnh nằm sát ngưỡng thì nó giúp
 * bộ giải bắt được lưới ô.
 */
function veVung_(anh, v, che) {
  var r = v.norm / Math.max(v.sw, v.sh);
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(v.sw * r));
  c.height = Math.max(1, Math.round(v.sh * r));
  var ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  if (che && che.mo) ctx.filter = 'blur(' + Math.max(0.6, c.width / 1200) + 'px)';
  ctx.drawImage(anh, v.sx, v.sy, v.sw, v.sh, 0, 0, c.width, c.height);
  ctx.filter = 'none';
  if (!che || (!che.xam && !che.cucbo)) return c;

  var d = ctx.getImageData(0, 0, c.width, c.height), a = d.data, i, p;
  var W = c.width, H = c.height, g = new Uint8Array(W * H);
  for (i = 0; i < W * H; i++) {
    p = i * 4;
    g[i] = che.xam ? Math.max(a[p], a[p + 1], a[p + 2])
                   : (a[p] * 0.299 + a[p + 1] * 0.587 + a[p + 2] * 0.114) | 0;
  }
  if (che.cucbo) {
    // Ngưỡng riêng cho từng khối 16×16: một góc bị loá, một góc trong bóng râm
    // thì ngưỡng chung sẽ đẩy bên sáng thành trắng hết, bên tối thành đen hết.
    var bw = Math.ceil(W / 16), bh = Math.ceil(H / 16), bx, by, x2, y2, s, n, yy, xx, ng;
    for (by = 0; by < H; by += bh) for (bx = 0; bx < W; bx += bw) {
      x2 = Math.min(bx + bw, W); y2 = Math.min(by + bh, H); s = 0; n = 0;
      for (yy = by; yy < y2; yy++) for (xx = bx; xx < x2; xx++) { s += g[yy * W + xx]; n++; }
      ng = n ? s / n : 128;
      for (yy = by; yy < y2; yy++) for (xx = bx; xx < x2; xx++) {
        p = (yy * W + xx) * 4;
        a[p] = a[p + 1] = a[p + 2] = g[yy * W + xx] > ng - 3 ? 255 : 0;
      }
    }
  } else {
    for (i = 0; i < W * H; i++) { p = i * 4; a[p] = a[p + 1] = a[p + 2] = g[i]; }
  }
  ctx.putImageData(d, 0, 0);
  return c;
}

/**
 * Dò Ô ĐỊNH VỊ của mã QR — ba ô vuông to ở ba góc mã, quét ngang hay quét dọc
 * qua tâm chúng đều cho dãy đen-trắng-đen-trắng-đen theo tỉ lệ 1:1:3:1:1.
 * Không dấu hiệu nào khác trên thẻ có tỉ lệ này, nên đây là cách tìm mã đáng tin nhất.
 * Chạy trên bản thu nhỏ còn 900 điểm ảnh nên chỉ tốn ~50 mili giây.
 */
function doMoc_(anh) {
  var W = anh.width, H = anh.height;
  var w = Math.min(900, W), h = Math.round(H * w / W), ti = W / w;
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var x = c.getContext('2d', { willReadFrequently: true });
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  x.drawImage(anh, 0, 0, w, h);
  var a = x.getImageData(0, 0, w, h).data, g = new Uint8Array(w * h), i, p, yy, xx;
  for (i = 0; i < w * h; i++) { p = i * 4; g[i] = Math.max(a[p], a[p + 1], a[p + 2]); }

  var bw = Math.ceil(w / 20), bh = Math.ceil(h / 20), bn = new Uint8Array(w * h);
  for (var by = 0; by < h; by += bh) for (var bx = 0; bx < w; bx += bw) {
    var X2 = Math.min(bx + bw, w), Y2 = Math.min(by + bh, h), s = 0, n = 0;
    for (yy = by; yy < Y2; yy++) for (xx = bx; xx < X2; xx++) { s += g[yy * w + xx]; n++; }
    var ng = n ? s / n : 128;
    for (yy = by; yy < Y2; yy++) for (xx = bx; xx < X2; xx++) bn[yy * w + xx] = g[yy * w + xx] < ng - 2 ? 1 : 0;
  }

  function hop(r) {                       // r = 5 độ dài dải liên tiếp, bắt đầu bằng ĐEN
    var t = r[0] + r[1] + r[2] + r[3] + r[4];
    if (t < 7) return 0;
    var m = t / 7, sai = m * 0.6;
    return (Math.abs(m - r[0]) < sai && Math.abs(m - r[1]) < sai && Math.abs(3 * m - r[2]) < 3 * sai &&
            Math.abs(m - r[3]) < sai && Math.abs(m - r[4]) < sai) ? m : 0;
  }
  var diem = [];
  function quet(ngang) {
    var L = ngang ? h : w, K = ngang ? w : h, u, v;
    for (u = 0; u < L; u += 2) {
      var r = [0, 0, 0, 0, 0], mau = 0;
      for (v = 0; v < K; v++) {
        var val = ngang ? bn[u * w + v] : bn[v * w + u];
        if (val === mau) { r[4]++; }
        else {
          if (mau === 1) {
            var m = hop(r);
            if (m) {
              var tam = v - r[4] - r[3] - r[2] / 2;
              diem.push(ngang ? { x: tam, y: u, m: m } : { x: u, y: tam, m: m });
            }
          }
          r = [r[1], r[2], r[3], r[4], 1]; mau = val;
        }
      }
    }
  }
  quet(true); quet(false);

  var cum = [];                            // gộp các lần bắt trúng cùng một ô định vị
  diem.forEach(function (d) {
    for (var k = 0; k < cum.length; k++) {
      var q = cum[k];
      if (Math.abs(q.x - d.x) < d.m * 2.5 && Math.abs(q.y - d.y) < d.m * 2.5 && Math.abs(q.m - d.m) < d.m * 0.6) {
        q.x = (q.x * q.n + d.x) / (q.n + 1); q.y = (q.y * q.n + d.y) / (q.n + 1);
        q.m = (q.m * q.n + d.m) / (q.n + 1); q.n++; return;
      }
    }
    cum.push({ x: d.x, y: d.y, m: d.m, n: 1 });
  });
  return cum.filter(function (q) { return q.n >= 3; })
            .sort(function (A, B) { return B.n - A.n; }).slice(0, 12)
            .map(function (q) { return { x: q.x * ti, y: q.y * ti, m: q.m * ti, n: q.n }; });
}

/** Từ các mốc dò được, dựng vùng cắt sát quanh mã. */
function vungTuMoc_(anh) {
  var W = anh.width, H = anh.height, cum = doMoc_(anh), nhom = [];
  cum.forEach(function (q) {                // ba ô định vị của cùng một mã nằm gần nhau
    for (var k = 0; k < nhom.length; k++) {
      var G = nhom[k];
      if (Math.abs(G.x - q.x) < q.m * 50 && Math.abs(G.y - q.y) < q.m * 50 && Math.abs(G.m - q.m) / G.m < 0.8) {
        G.x1 = Math.min(G.x1, q.x); G.y1 = Math.min(G.y1, q.y);
        G.x2 = Math.max(G.x2, q.x); G.y2 = Math.max(G.y2, q.y);
        G.x = (G.x1 + G.x2) / 2; G.y = (G.y1 + G.y2) / 2;
        G.m = (G.m * G.n + q.m * q.n) / (G.n + q.n); G.n += q.n; return;
      }
    }
    nhom.push({ x: q.x, y: q.y, x1: q.x, y1: q.y, x2: q.x, y2: q.y, m: q.m, n: q.n });
  });
  nhom.sort(function (A, B) { return B.n - A.n; });
  var ra = [];
  nhom.slice(0, 6).forEach(function (G, i) {
    var trai = Math.max(G.x2 - G.x1, G.y2 - G.y1);
    var co = [Math.round(G.m * 45), Math.round(G.m * 30), Math.round(G.m * 65)];
    if (trai > G.m * 10) co.unshift(Math.round(trai * 1.5));   // đã bắt được ≥2 mốc thì dùng luôn khoảng cách giữa chúng
    co.forEach(function (s, j) {
      if (s < 60) return;
      if (s > Math.min(W, H)) s = Math.min(W, H);
      ra.push({
        ten: 'mốc' + (i + 1) + '#' + j, dau: j === 0, norm: 1100,
        sx: Math.max(0, Math.min(W - s, Math.round(G.x - s / 2))),
        sy: Math.max(0, Math.min(H - s, Math.round(G.y - s / 2))),
        sw: s, sh: s
      });
    });
  });
  return ra;
}

/**
 * Lưới ô VUÔNG (không theo tỉ lệ ảnh — đây chính là chỗ bản cũ sai), cạnh = fr × chiều
 * rộng ảnh, chồng mép 50% nên mã nằm vắt qua ranh giới vẫn có một ô chứa trọn.
 * Xếp ô sát mép ngang lên trước vì mã căn cước luôn ở mép thẻ.
 */
function oVuong_(W, H, fr, norm) {
  var s = Math.floor(W * fr);
  if (s < 80) return [];
  if (s > Math.min(W, H)) s = Math.min(W, H);
  var b = Math.max(1, Math.floor(s * 0.5)), xs = [], ys = [], o = [], x, y;
  for (x = 0; x + s <= W; x += b) xs.push(x);
  if (xs[xs.length - 1] !== W - s) xs.push(W - s);
  for (y = 0; y + s <= H; y += b) ys.push(y);
  if (ys[ys.length - 1] !== H - s) ys.push(H - s);
  xs.forEach(function (X) {
    ys.forEach(function (Y) {
      var dx = Math.min(X, W - s - X) / W, dy = Math.abs((Y + s / 2) / H - 0.5);
      o.push({
        ten: 'ô' + fr + '(' + Math.round((X + s / 2) / W * 100) + ',' + Math.round((Y + s / 2) / H * 100) + ')',
        sx: X, sy: Y, sw: s, sh: s, norm: norm, uu: dx * 2 + dy
      });
    });
  });
  return o.sort(function (A, B) { return A.uu - B.uu; });
}

/** Kế hoạch quét lưới: đã gộp sẵn cặp {vùng, chế độ} theo đúng thứ tự sẽ thử. */
function keHoachLuoi_(W, H) {
  var ke = [], toan = { ten: 'toàn ảnh', sx: 0, sy: 0, sw: W, sh: H, norm: 1200 };
  ke.push({ v: toan, m: 0 }); ke.push({ v: toan, m: 1 });
  var t35 = oVuong_(W, H, 0.35, 1100), t55 = oVuong_(W, H, 0.55, 1100), t24 = oVuong_(W, H, 0.24, 900);
  [0, 1, 2, 3, 4].forEach(function (m) {
    var lim = m === 0 ? 18 : (m < 3 ? 14 : 8);
    [t35, t55, t24].forEach(function (ds) {
      for (var k = 0; k < ds.length && k < lim; k++) ke.push({ v: ds[k], m: m });
    });
  });
  return ke;
}

/** Bộ giải chạy bằng JavaScript, ăn thẳng ImageData nên rất nhanh (~0,1 giây). */
function thuJsQR_(c) {
  if (typeof jsQR === 'undefined') return '';
  try {
    var d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, c.width, c.height);
    var r = jsQR(d.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
    return (r && r.data) ? r.data : '';
  } catch (e) { return ''; }
}

/** Bộ giải cài sẵn trong máy. Trên Android chính là ML Kit của Google — bộ Zalo dùng. */
function thuMayGiaiSan(nguon) {
  if (typeof BarcodeDetector === 'undefined') return Promise.resolve('');
  return createImageBitmap(nguon)
    .then(function (anh) {
      var may = new BarcodeDetector({ formats: ['qr_code'] });
      return may.detect(anh).then(function (ds) {
        try { anh.close(); } catch (e) {}
        return (ds && ds.length && ds[0].rawValue) ? ds[0].rawValue : '';
      });
    })
    .catch(function () { return ''; });
}

/** ZXing qua html5-qrcode — khoẻ nhưng chậm (~1,1 giây/lượt) nên để dành chặng B. */
function thuThuVien(nguon) {
  if (typeof Html5Qrcode === 'undefined') return Promise.resolve('');
  var doc = new Html5Qrcode('anhtam');
  return doc.scanFile(nguon, false)
    .then(function (t) { try { doc.clear(); } catch (e) {} return t || ''; })
    .catch(function () { try { doc.clear(); } catch (e) {} return ''; });
}

function thuZXingCanvas_(c) {
  return new Promise(function (ok) { c.toBlob(function (b) { ok(b); }, 'image/png'); })
    .then(function (b) { return b ? thuThuVien(new File([b], 'o.png', { type: 'image/png' })) : ''; });
}

/** Nhường luồng cho trình duyệt vẽ lại, khỏi treo màn hình khi dò lâu. */
function nhuong_() { return new Promise(function (ok) { setTimeout(ok, 0); }); }

/**
 * Cửa chính: nhận File/Blob/Canvas, trả về chuỗi trong mã QR (hoặc '' nếu chịu thua).
 * baoBuoc(chuỗi) được gọi liên tục để hiện tiến độ cho người dùng.
 */
function giaiMaTuNguon(nguon, baoBuoc) {
  return createImageBitmap(nguon).then(function (anh) {
    var vm = vungTuMoc_(anh);
    var dau = vm.filter(function (z) { return z.dau; }).slice(0, 4);
    var ke = keHoachLuoi_(anh.width, anh.height);
    // Tách kế hoạch lưới làm hai: phần chế độ "gốc" rẻ chạy TRƯỚC chặng ZXing đắt,
    // phần còn lại để sau. Nhờ vậy thẻ dễ xong trong ~3 giây, chỉ thẻ khó mới tốn ZXing.
    var cat = ke.findIndex(function (z) { return z.m > 0; });
    if (cat < 0) cat = ke.length;
    var tong = Math.min(vm.length, 8) * 3 + dau.length + ke.length;
    var dem = 0, batDau = Date.now(), daChayB = false;
    function conGio() { return Date.now() - batDau < QR_HAN_GIO_MS; }

    function xong(t) { try { anh.close(); } catch (e) {} return t; }
    function tien(nhan) {
      dem++;
      // Chỉ vẽ lại tiến độ cách quãng: cập nhật từng lượt làm trình duyệt dựng lại
      // bố cục liên tục, tự nó ngốn nhiều thời gian hơn cả việc giải mã.
      if (baoBuoc && dem % 4 === 1) baoBuoc('Đang dò ' + nhan + ' (' + dem + '/' + tong + ')');
    }
    function nghi() { return dem % 15 === 0 ? nhuong_() : Promise.resolve(); }

    /** Một lượt nhanh: jsQR trước, rồi bộ giải sẵn của máy (Android: ML Kit). */
    function luotNhanh(v, che, tiep) {
      tien(v.ten);
      var c = veVung_(anh, v, che);
      var t = thuJsQR_(c);
      if (t) return Promise.resolve(t);
      return thuMayGiaiSan(c).then(function (t2) {
        return t2 || nghi().then(tiep);
      });
    }

    // Chặng mở màn — thử nguyên ảnh: người chụp sát riêng tấm thẻ thì xong ngay đây,
    // chỉ tốn 2 lượt mà cứu được trường hợp phổ biến nhất.
    function changMo(k) {
      if (k >= 2 || k >= ke.length) return changA(0, 0);
      return luotNhanh(ke[k].v, CHE_DO_QR[ke[k].m], function () { return changMo(k + 1); });
    }
    // Chặng A — vùng suy ra từ ô định vị, 3 chế độ rẻ nhất
    function changA(m, k) {
      if (m >= 3 || !conGio()) return changC(2, cat);
      if (k >= vm.length || k >= 8) return changA(m + 1, 0);
      return luotNhanh(vm[k], CHE_DO_QR[m], function () { return changA(m, k + 1); });
    }
    // Chặng B — ZXing (bộ Zalo dùng) trên vùng tốt nhất của mỗi cụm mốc.
    // Hết giờ ở đâu cũng phải ghé qua đây một lần rồi mới được bỏ cuộc: đây là bộ giải
    // khoẻ nhất chạy bằng JavaScript, bỏ nó thì mất luôn cơ hội cuối.
    function changB(k) {
      daChayB = true;
      if (k >= dau.length) return conGio() ? changC(cat, ke.length) : '';
      tien(dau[k].ten + ' (kỹ)');
      return thuZXingCanvas_(veVung_(anh, dau[k], CHE_DO_QR[0])).then(function (t) {
        return t || changB(k + 1);
      });
    }
    // Chặng C — quét lưới ô vuông toàn ảnh, chạy đoạn [k, het)
    function changC(k, het) {
      if (k >= het || !conGio()) return (het === cat || !daChayB) ? changB(0) : '';
      return luotNhanh(ke[k].v, CHE_DO_QR[ke[k].m], function () { return changC(k + 1, het); });
    }
    return changMo(0).then(xong, function () { return xong(''); });
  }).catch(function () { return ''; });
}


// tự chèn dấu / cho ô ngày
['ngay_sinh', 'ngay_lam_pv'].forEach(function (id) {
  $(id).addEventListener('input', function () {
    var s = this.value.replace(/\D/g, '').substring(0, 8);
    this.value = s.length > 4 ? s.substring(0, 2) + '/' + s.substring(2, 4) + '/' + s.substring(4)
               : s.length > 2 ? s.substring(0, 2) + '/' + s.substring(2) : s;
  });
});

$('so_cccd').addEventListener('blur', function () {
  var c = this.value.replace(/\D/g, '');
  if (c.length === 12 && maCT) traTinhTrang(c);
});

// ---------- Gửi ----------
$('form').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var loi = '', cccd = $('so_cccd').value.replace(/\D/g, ''),
      ten = $('ho_ten').value.trim().replace(/\s+/g, ' '),
      ct = $('ma_ct').value, nn = $('nguoi_nhap').value.trim(),
      sdt = $('sdt').value.replace(/\D/g, ''),
      ngay = $('ngay_lam_pv').value.trim(),
      tenNgay = loaiCT === 'chinh_thuc' ? 'Ngày phỏng vấn' : 'Ngày đi làm',
      cach = ngayCachHomNay(ngay);
  if (!ct) loi = 'Chưa chọn nhà máy';
  else if (ten.length < 3 || ten.indexOf(' ') < 0) loi = 'Nhập đầy đủ họ và tên';
  else if (cccd.length !== 12) loi = cccd.length ? 'Số CCCD đang có ' + cccd.length + ' chữ số, cần đúng 12' : 'Chưa nhập số CCCD';
  // Số điện thoại là thứ người đón dùng để GỌI — sai một chữ số là mất công cả dây chuyền.
  // Trước đây ô này không kiểm gì cả, đã lọt một số chỉ có 9 chữ số vào bảng.
  else if (!sdtHopLe(sdt)) loi = loiSdt(sdt);
  // BẮT BUỘC có ngày: không có ngày thì người này không nằm trong báo cáo của ngày nào cả,
  // người đón sẽ không bao giờ biết mà chờ. Đây từng là lỗ hổng thật — nửa số dòng bỏ trống.
  else if (!ngay) loi = 'Chưa nhập ' + tenNgay.toLowerCase();
  else if (cach === null) loi = tenNgay + ' không hợp lệ — nhập dạng dd/mm/yyyy';
  else if (nn.length < 2) loi = 'Nhập tên người tuyển dụng (để nhóm biết ai vừa đăng ký)';
  else if (!$('dong_y').checked) loi = 'Cần tích ô đồng ý mới đăng ký được';
  var o = $('loi_form');
  o.textContent = loi; o.classList.toggle('hien', !!loi);
  if (loi) { o.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }

  // Ngày cách quá xa gần như luôn là GÕ NHẦM THÁNG. Đã gặp thật: nhập 17/08 mà
  // ghi ngày đi làm 18/09 — người đó biến mất khỏi báo cáo suốt một tháng.
  // Hỏi lại một câu, không chặn cứng, vì vẫn có ca hẹn xa thật.
  if (cach > 45 || cach < -1) {
    if (!confirm(tenNgay + ' là ' + ngay + ', tức ' +
        (cach > 0 ? 'còn ' + cach + ' ngày nữa' : 'đã qua ' + (-cach) + ' ngày') +
        '.\n\nCó đúng không? Kiểm lại tháng xem có gõ nhầm.')) {
      $('ngay_lam_pv').focus(); return;
    }
  }

  var nut = $('nut_dk');
  nut.disabled = true; nut.textContent = 'Đang gửi…';
  var gt = document.querySelector('input[name=gt]:checked');
  var d = {
    token: TOKEN_API, hanh_dong: 'dang_ky', ma_ct: ct,
    so_cccd: cccd, ho_ten: ten,
    ngay_sinh: $('ngay_sinh').value.trim(),
    // MỘT ô trên màn hình, nhưng vẫn ghi vào ĐÚNG HAI CỘT riêng trong bảng —
    // vì báo cáo đếm thời vụ theo ngày đi làm, chính thức theo ngày phỏng vấn.
    ngay_phong_van: loaiCT === 'chinh_thuc' ? ngay : '',
    ngay_di_lam: loaiCT === 'chinh_thuc' ? '' : ngay,
    gioi_tinh: gt ? gt.value : '',
    sdt: sdt,
    noi_thuong_tru: $('noi_thuong_tru').value.trim(),
    ghi_chu: $('ghi_chu').value.trim(),
    nguoi_nhap: nn,
    ngay_cap: ngayCap, cmnd_cu: cmndCu,
    nguon_nhap: nguonNhap, qr_tho: qrTho, dong_y: true
  };
  try { localStorage.setItem('nguoi_nhap', nn); } catch (e) {}

  guiDangKy(d, ten, nut);
});

/**
 * Gửi hồ sơ. Nếu máy chủ trả CAN_XAC_NHAN (người này vừa đăng ký ở công ty khác)
 * thì hỏi người nhập, đồng ý mới gửi lại kèm cờ xác nhận — lúc đó vẫn đăng ký
 * và ghi rõ là trùng.
 */
function guiDangKy(d, ten, nut) {
  goiAPI(d).then(function (kq) {
    if (kq.ok && kq.ma === 'CAN_XAC_NHAN') {
      nut.disabled = false; nut.textContent = 'Xác nhận nộp';
      var ds = (kq.danh_sach_trung || []).map(function (x) {
        return '• ' + x.ten_cong_ty + ' (' + x.loai + ')\n  do "' + x.nguoi_nhap +
               '" đăng ký ngày ' + x.ngay_dk;
      }).join('\n');
      var hoi = 'NGƯỜI NÀY VỪA ĐĂNG KÝ Ở CÔNG TY KHÁC\n\n' + ds +
                '\n\nBạn vẫn muốn đăng ký cho "' + (kq.ten_cong_ty || tenCT) + '"?\n' +
                'Nếu đồng ý, hệ thống vẫn đăng ký và ghi rõ là trùng.';
      if (!confirm(hoi)) {
        baoDai('vang', '<b>Đã huỷ.</b> Người này vừa đăng ký ở: ' + thoat(kq.trung_voi));
        hien('form'); return;
      }
      d.xac_nhan_trung = true;
      nut.disabled = true; nut.textContent = 'Đang gửi…';
      guiDangKy(d, ten, nut);
      return;
    }
    if (kq.ok && (kq.ma === 'THANH_CONG' || kq.ma === 'DANG_KY_LAI' || kq.ma === 'TRUNG_KHAC_CT')) {
      luuDanhSach({ ma_ld: kq.ma_ld, ho_ten: ten, cccd_che: kq.cccd_che, ten_cong_ty: kq.ten_cong_ty || tenCT });
    }
    // Máy chủ đã trả lời rành mạch (nhận hoặc từ chối) → phiếu không còn treo
    boPhieu();
    veTinhTrang(kq);
    goiAPI({ token: TOKEN_API, hanh_dong: 'gui_tin' }).catch(function () {});
  }).catch(function () {
    // Mất mạng giữa chừng: CẤT PHIẾU LẠI trong máy để không mất công gõ,
    // lần mở trang sau sẽ hiện nút gửi lại. Máy chủ vẫn soát trùng như thường
    // nên gửi lại không bao giờ sinh dòng kép.
    catPhieu(d);
    veTinhTrang({ ok: false, ma: 'MAT_MANG',
      loi: 'Không gửi được — phiếu đã được CẤT LẠI TRONG MÁY. Có mạng thì mở lại trang này, hệ thống sẽ nhắc gửi lại.' });
    nut.disabled = false; nut.textContent = 'Xác nhận nộp';
  });
}

// ---------- Lưới an toàn: phiếu chưa gửi được ----------
function catPhieu(d) {
  try { localStorage.setItem('phieu_cho', JSON.stringify(d)); } catch (e) {}
}
function boPhieu() {
  try { localStorage.removeItem('phieu_cho'); } catch (e) {}
}
function xemPhieuCho() {
  var d = null;
  try { d = JSON.parse(localStorage.getItem('phieu_cho') || 'null'); } catch (e) {}
  if (!d || !d.so_cccd) return;
  var o = $('canh_bao');
  o.innerHTML = '<b>Còn 1 phiếu chưa gửi được:</b> ' + thoat(d.ho_ten) + ' (***' + d.so_cccd.slice(-4) + ')' +
    '<br><button type="button" id="nut_guilai" style="margin-top:8px;padding:8px 14px;border:0;border-radius:7px;' +
    'background:var(--xanh);color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">Gửi lại ngay</button>' +
    '<button type="button" id="nut_bophieu" style="margin-top:8px;margin-left:8px;padding:8px 14px;border:0;' +
    'border-radius:7px;background:#e3e7eb;font-family:inherit;font-size:14px;cursor:pointer">Bỏ phiếu này</button>';
  o.className = 'canhbao hien vang';
  hien('form');
  $('nut_guilai').addEventListener('click', function () {
    var nut = $('nut_dk');
    nut.disabled = true; nut.textContent = 'Đang gửi lại…';
    o.className = 'canhbao';
    guiDangKy(d, d.ho_ten, nut);
  });
  $('nut_bophieu').addEventListener('click', function () { boPhieu(); o.className = 'canhbao'; });
}

function veTinhTrang(kq) {
  var loai, dau, tieu, mo = '', ma = kq.ma_ld || '', them = '';
  if (kq.ok && kq.ma === 'THANH_CONG')       { loai = 'tot';  dau = '✓'; tieu = 'Đăng ký thành công'; mo = kq.ho_ten + ' — ' + kq.cccd_che; }
  else if (kq.ok && kq.ma === 'DANG_KY_LAI') { loai = 'tot';  dau = '✓'; tieu = 'Đã đăng ký lại';     mo = kq.ho_ten + ' — lần trước ' + kq.ma_lan_truoc + ' đã kết thúc'; }
  else if (kq.ok && kq.ma === 'TRUNG_KHAC_CT'){ loai = 'tot'; dau = '✓'; tieu = 'Đã đăng ký (có trùng)';
      mo = kq.ho_ten;
      them = '<p style="color:var(--canh)">(!) Cũng đang đăng ký tại: ' + thoat(kq.trung_voi) + '</p>'; }
  else if (kq.ok && kq.ma === 'TRUNG')       { loai = 'canh'; dau = '!'; tieu = 'Trùng — chưa đăng ký được';
      mo = kq.ho_ten + (kq.con_khoa_ngay ? ' — còn ' + kq.con_khoa_ngay + ' ngày nữa mới đăng ký lại được' : '');
      them = '<p><b>Đã được "' + thoat(kq.nguoi_nhap_cu || 'không rõ') + '"</b> đăng ký tại <b>' +
             thoat(kq.ten_cong_ty_cu || '?') + '</b>' + (kq.ngay_dk ? ' ngày ' + thoat(kq.ngay_dk) : '') + '</p>'; }
  else { loai = 'xau'; dau = '×'; tieu = 'Chưa đăng ký được'; mo = kq.loi || 'Có lỗi xảy ra'; ma = ''; }

  if (kq.ten_cong_ty && kq.ma !== 'TRUNG' && kq.ma !== 'TRUNG_KHAC_CT') them += '<p>' + thoat(kq.ten_cong_ty) + '</p>';
  if (kq.canh_bao_cheo) them += '<p style="color:var(--canh)">(!) ' + thoat(kq.canh_bao_cheo) + '</p>';

  $('man_tt').className = 'tt ' + loai;
  $('man_tt').innerHTML =
    '<div class="vong">' + dau + '</div><h2>' + tieu + '</h2>' +
    '<p>' + thoat(mo) + '</p>' + them +
    (ma ? '<div class="ma">' + thoat(ma) + '</div>' : '') +
    '<button type="button" class="nut" onclick="location.reload()">Đăng ký người tiếp theo</button>';
  hien('man_tt');
}

// ---------- Danh sách đã nhập hôm nay (lưu trong máy, KHÔNG lộ dữ liệu người khác) ----------
function khoaNgay() { return 'ds_' + new Date().toISOString().substring(0, 10); }

function luuDanhSach(m) {
  try {
    var ds = JSON.parse(localStorage.getItem(khoaNgay()) || '[]');
    m.gio = new Date().toTimeString().substring(0, 5);
    ds.unshift(m);
    localStorage.setItem(khoaNgay(), JSON.stringify(ds.slice(0, 200)));
  } catch (e) {}
}

$('nut_ds').addEventListener('click', function () {
  var ds = [];
  try { ds = JSON.parse(localStorage.getItem(khoaNgay()) || '[]'); } catch (e) {}
  $('ds_tom').textContent = ds.length ? 'Bạn đã đăng ký ' + ds.length + ' người trong hôm nay'
                                      : 'Chưa đăng ký ai trong hôm nay';
  $('ds_noi').innerHTML = ds.length
    ? ds.map(function (m) {
        return '<div class="ds-hang"><b>' + thoat(m.ho_ten) + '</b>' +
               '<span style="color:var(--mo);font-size:13px">' + thoat(m.cccd_che || '') + ' · ' + thoat(m.ma_ld) + '</span>' +
               '<span class="gio">' + thoat(m.gio) + '</span></div>';
      }).join('')
    : '<div class="trong">Danh sách này chỉ hiện những người <b>bạn</b> vừa đăng ký trên máy này hôm nay.<br>' +
      'Danh sách đầy đủ của cả đội xem trong nhóm Zalo hoặc Google Sheet.</div>';
  hien('man_ds');
});
$('nut_dong_ds').addEventListener('click', function () { hien('form'); });
